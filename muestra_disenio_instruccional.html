<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Diseño Instruccional de Cursos Presenciales, Virtuales o Híbridos — muestra gratuita de Sintropía Social con propuesta de secuencia didáctica generada con IA.">
<title>Muestra: Diseño Instruccional — Sintropía Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --purple: #631EEB;
    --purple-dark: #4E17B8;
    --orange: #FF7929;
    --bg: #F5F3FC;
    --card: #FFFFFF;
    --text: #2C2C2C;
    --subtle: #6B6B78;
    --border: #E6E2F5;
    --error: #C0392B;
    --error-bg: #FDECEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Open Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
  }
  header.top {
    background: var(--purple); color: #fff; padding: 26px 18px 44px; text-align: center;
    border-radius: 0 0 22px 22px;
  }
  header.top .marca { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  header.top .marca span { color: var(--orange); }
  header.top .subt { font-size: 13.5px; opacity: .92; margin-top: 6px; max-width: 460px; margin-left: auto; margin-right: auto; }
  main { max-width: 660px; margin: -26px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 26px 24px; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(99,30,235,.08); border: 1px solid var(--border);
  }
  h1 { font-size: 21px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 4px; color: var(--purple-dark); }
  h3 { font-size: 15px; margin: 22px 0 2px; color: var(--purple-dark); }
  p.subtle, .subtle { color: var(--subtle); font-size: 13.5px; }
  .progreso { display: flex; gap: 6px; margin: 18px 0 22px; }
  .progreso .paso { flex: 1; height: 6px; border-radius: 4px; background: var(--border); }
  .progreso .paso.hecho { background: var(--orange); }
  .progreso .paso.actual { background: var(--purple); }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 5px; }
  label .req { color: var(--orange); }
  input[type=text], input[type=email], select, textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 76px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); }
  .fila-botones { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px;
    padding: 12px 24px; border: none; cursor: pointer;
  }
  button.primary { background: var(--purple); color: #fff; }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { padding: 10px 13px; border-radius: 9px; font-size: 13.5px; margin: 12px 0; }
  .msg.error { background: var(--error-bg); color: var(--error); }

  .campo-trampa { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; overflow: hidden; }

  /* Preguntas mixtas (abiertas y cerradas) */
  .pregunta-di { border-top: 1px solid var(--border); padding: 18px 0; }
  .pregunta-di:first-of-type { border-top: none; padding-top: 4px; }
  .pregunta-di .num { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
    color: var(--purple); text-transform: uppercase; margin-bottom: 4px; }
  .pregunta-texto { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  .pregunta-hint { font-size: 12.5px; color: var(--subtle); margin-bottom: 10px; }
  .opciones-di { display: flex; gap: 8px; flex-wrap: wrap; }
  .op-choice {
    border: 1.5px solid var(--border); border-radius: 9px; background: #fff;
    color: var(--subtle); font-weight: 600; font-size: 13px; padding: 10px 14px; cursor: pointer; text-align: center;
    transition: background .12s, border-color .12s, color .12s;
  }
  .op-choice.marcada { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* Resultado — secuencia didáctica */
  .secuencia-fase { border-top: 1px solid var(--border); padding: 16px 0; }
  .secuencia-fase:first-of-type { border-top: none; padding-top: 4px; }
  .secuencia-fase .num-fase { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
    color: var(--purple); text-transform: uppercase; margin-bottom: 6px; }
  .secuencia-fase p { font-size: 13.5px; line-height: 1.85; color: var(--text); margin: 0; white-space: pre-wrap; }
  .secuencia-duracion { background: #FAF8FF; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-top: 18px; font-size: 13px; color: var(--subtle); }
  .secuencia-duracion b { color: var(--purple-dark); }

  /* Pantalla de espera mientras la IA genera la propuesta */
  .pantalla-centrada { text-align: center; padding: 30px 4px 12px; }
  .spinner { width: 40px; height: 40px; margin: 0 auto; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--purple); animation: girar .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  @keyframes girar { to { transform: rotate(360deg); } }

  .cta { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff; border-radius: 14px;
    padding: 22px 24px; margin-top: 8px; }
  .cta h2 { color: #fff; }
  .cta p { font-size: 13.5px; opacity: .95; }
  .cta a { color: #fff; font-weight: 700; }
  .cta .fila-botones a.boton-cta {
    display: inline-block; text-decoration: none; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 14px;
  }
  .cta .boton-cta.solido { background: #fff; color: var(--purple-dark); }
  .cta .boton-cta.contorno { border: 1.5px solid rgba(255,255,255,.7); color: #fff; }

  footer.pie { text-align: center; font-size: 12px; color: var(--subtle); padding: 10px 16px 34px; }
  footer.pie .wordmark { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  footer.pie a { color: var(--purple); text-decoration: none; }
</style>

  <div class="marca">Sintropía <span>Social</span></div>

<script>
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZbLiOP7QXvrgUIDhhVciVGY-Yval3YBvqBHOpQfK8El2wHXNNBtZvsnkbwMaJUss/exec';

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function jsonp(action, params) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' }); };
    setTimeout(function () { if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); } }, 40000);
    script.src = url;
    document.body.appendChild(script);
  });
}
// Variante de jsonp() que manda los parámetros por POST (cuerpo de la
// solicitud) en vez de la URL — jsonp()/GET tiene un límite práctico de
// unos cuantos KB en la URL, y "secciones"/"resumenTexto" del correo de
// resultado pueden superarlo fácilmente. Content-Type text/plain evita que
// el navegador dispare una verificación (preflight) que Apps Script no
// sabe responder — mismo patrón que ya usa el panel de administración
// para subir fotos/adjuntos (ver _subirFotoInstrumento en index.html).
function jsonpPost(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' });
    }, timeoutMs || 40000);
    var body = { action: action };
    params = params || {};
    for (var k in params) { if (params[k] !== undefined && params[k] !== null) body[k] = params[k]; }
    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (resp) { return resp.json(); }).then(function (data) {
      if (timedOut) return;
      clearTimeout(timer);
      resolve(data);
    }).catch(function () {
      if (timedOut) return;
      clearTimeout(timer);
      resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' });
    });
  });
}

var CATEGORIAS_CRM_OPCIONES = ['Gobierno y Sector Público', 'ONG y Fundaciones', 'Educación', 'Salud y Bienestar',
  'Universidad', 'Cámara empresarial', 'Empresa privada', 'Retail y Consumo', 'Fintech y Servicios',
  'Tecnología y Telecom', 'Turismo y Hospitalidad', 'Organismo internacional', 'Otro'];

/* ============================================================
 * 10 preguntas mixtas (abiertas y cerradas) sobre el curso que
 * la organización quiere desarrollar.
 * ============================================================ */
var PREGUNTAS_DI = [
  { campo: 'modalidad', tipo: 'select', q: '¿Qué modalidad buscas para tu curso?',
    opciones: ['Presencial', 'Virtual (asíncrono)', 'Virtual (síncrono / en vivo)', 'Híbrido', 'Aún no lo decido'] },
  { campo: 'tema', tipo: 'texto', q: '¿Cuál es el tema o contenido principal del curso que quieres desarrollar?',
    hint: 'Sé tan específico como puedas.' },
  { campo: 'dirigido', tipo: 'select', q: '¿A quién va dirigido principalmente?',
    opciones: ['Colaboradores / empleados', 'Estudiantes', 'Público en general', 'Clientes', 'Otro'] },
  { campo: 'necesidad', tipo: 'texto', q: '¿Qué problema o necesidad concreta buscas resolver con este curso?',
    hint: 'Ej: falta de una habilidad específica, proceso de inducción, actualización normativa...' },
  { campo: 'duracion', tipo: 'select', q: '¿Cuánto tiempo aproximado quieres que dure el curso?',
    opciones: ['Menos de 2 horas (taller breve)', 'Medio día', '1-2 días', 'Varias semanas (curso extendido)', 'Programa completo (varios meses)'] },
  { campo: 'nivel', tipo: 'select', q: '¿Qué tan familiarizados están los participantes con el tema?',
    opciones: ['Principiantes', 'Nivel intermedio', 'Avanzados', 'Nivel mixto'] },
  { campo: 'objetivo', tipo: 'texto', q: '¿Qué te gustaría que los participantes sean capaces de hacer al terminar el curso?',
    hint: 'El objetivo de aprendizaje, en tus propias palabras.' },
  { campo: 'recursos', tipo: 'select', q: '¿Qué recursos tecnológicos tienes disponibles?',
    opciones: ['Plataforma LMS propia', 'Videoconferencia (Zoom / Meet / Teams)', 'Salón físico con proyector', 'Ninguno todavía', 'Otro'] },
  { campo: 'evaluacion', tipo: 'texto', q: '¿Cómo te gustaría evaluar que el aprendizaje realmente ocurrió?',
    hint: 'Examen, proyecto práctico, observación en el puesto... o dinos si aún no lo has pensado.' },
  { campo: 'notas', tipo: 'texto', q: '¿Algo más que debamos saber para diseñar tu secuencia didáctica?',
    hint: 'Opcional.', opcional: true }
];

var state = { paso: 0, datos: null, respuestas: {}, secuencia: null, enviado: false, correoResultadoEnviado: false };

var FASES_SECUENCIA = [
  { clave: 'apertura', numero: '1 de 4', titulo: 'Apertura y encuadre' },
  { clave: 'desarrollo', numero: '2 de 4', titulo: 'Desarrollo' },
  { clave: 'practica', numero: '3 de 4', titulo: 'Práctica y aplicación' },
  { clave: 'cierre', numero: '4 de 4', titulo: 'Cierre y evaluación' }
];
var app = document.getElementById('app');
var TOTAL_PASOS = 3; // 0 datos de la organización · 1 preguntas · 2 resultado (secuencia didáctica)

function _pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

var CITAS_DI = {
  gagne: 'Gagné, R. M. (1985). The Conditions of Learning and Theory of Instruction (4a ed.). Holt, Rinehart and Winston.',
  bloom: 'Anderson, L. W. y Krathwohl, D. R. (2001). A Taxonomy for Learning, Teaching, and Assessing: A Revision of Bloom’s Taxonomy of Educational Objectives. Longman.',
  wiggins: 'Wiggins, G. y McTighe, J. (2005). Understanding by Design (2a ed.). ASCD.',
  knowles: 'Knowles, M. S. (1980). The Modern Practice of Adult Education: Andragogy versus Pedagogy. Cambridge Adult Education.',
  kolb: 'Kolb, D. A. (1984). Experiential Learning: Experience as the Source of Learning and Development. Prentice-Hall.',
  merrill: 'Merrill, M. D. (2002). First principles of instruction. Educational Technology Research and Development, 50(3), 43–59.',
  mager: 'Mager, R. F. (1997). Preparing Instructional Objectives (3a ed.). Center for Effective Performance.'
};

function _duracionSugerida(duracion) {
  var mapa = {
    'Menos de 2 horas (taller breve)': '1 sesión única de 90–120 minutos, sin receso largo (como máximo, una pausa de 5 minutos a la mitad).',
    'Medio día': '1 sesión de aproximadamente 4 horas, con un receso de 15 minutos.',
    '1-2 días': '2 sesiones de 4–5 horas cada una (o 1 día completo con receso de comida), dejando la fase de Práctica y aplicación para después de un receso, cuando la atención se renueva.',
    'Varias semanas (curso extendido)': '6–8 sesiones semanales de 90–120 minutos, con una tarea o práctica breve entre sesión y sesión para sostener la curva de retención.',
    'Programa completo (varios meses)': 'un programa modular de 3–4 meses, organizado en bloques temáticos de 2–3 semanas cada uno, con un proyecto integrador al cierre de cada bloque y uno final al término del programa.'
  };
  return mapa[duracion] || 'una duración a definir junto con tu equipo, según la disponibilidad real de los participantes.';
}

// Propuesta de secuencia didáctica generada por reglas fijas — igual que
// makeDiag() en diagnostico.html o interpretacionReglasSE() en
// muestra_se.html: instantánea, sin depender de que Gemini responda, y
// fundamentada en marcos reales de diseño instruccional (Gagné, la
// taxonomía revisada de Bloom, Wiggins & McTighe, Knowles, Kolb y
// Merrill), sin inventar datos que la persona no dio. La IA (ver
// _paramsInterpretacionIA) solo aporta una sección adicional de
// "Recomendaciones", nunca sustituye esta propuesta base.
function secuenciaReglas(d, r) {
  var tema = r.tema || 'el tema de tu curso';
  var objetivo = r.objetivo || 'el objetivo que compartiste';
  var necesidad = r.necesidad || '';
  var dirigido = r.dirigido || 'los participantes';
  var dirigidoMin = dirigido.toLowerCase();
  var modalidad = r.modalidad || '';
  var nivel = r.nivel || '';
  var recursos = r.recursos || '';
  var evaluacion = r.evaluacion || '';
  var esGrupoAdulto = (dirigido === 'Colaboradores / empleados' || dirigido === 'Clientes');

  /* -- 1. Apertura y encuadre: captar atención, informar el objetivo,
   * activar conocimiento previo (primeros eventos de Gagné). -- */
  var aperturaGancho = _pick([
    'Abre con una pregunta o un caso breve y real relacionado con ' + tema + ' — algo que ' + dirigidoMin + ' reconozcan de inmediato — antes de presentar el objetivo formal; esto capta la atención desde el primer minuto.',
    'Abre con una mini-encuesta o lluvia de ideas sobre ' + tema + ' — además de captar la atención, te da información en tiempo real sobre qué tanto sabe realmente el grupo.'
  ]);
  var aperturaTexto = aperturaGancho + ' Declara con toda claridad el objetivo de la sesión: al terminar, ' + dirigidoMin + ' podrán ' + objetivo + '. Nombrarlo desde el inicio ayuda a que cada actividad posterior se perciba como un paso hacia ahí y no como contenido suelto (' + CITAS_DI.gagne + ').';
  if (esGrupoAdulto) {
    aperturaTexto += ' Como el grupo son ' + dirigidoMin + ', vale la pena abrir también preguntando qué experiencia previa traen sobre ' + tema + ': la andragogía plantea que las personas adultas aprenden mejor cuando el contenido nuevo se ancla en problemas y experiencia que ya reconocen como propios, no en abstracciones (' + CITAS_DI.knowles + ').';
  } else if (necesidad) {
    aperturaTexto += ' Conecta explícitamente esta apertura con la necesidad que identificaste — "' + necesidad + '" — para que desde el primer momento quede claro el "para qué" del curso.';
  }

  /* -- 2. Desarrollo: presentar el contenido y guiar, nivelado con la
   * taxonomía de Bloom según el punto de partida del grupo. -- */
  var progresionBloom;
  if (nivel === 'Principiantes') {
    progresionBloom = 'empieza en los niveles de "recordar" y "comprender" — define términos, muestra ejemplos trabajados paso a paso — antes de pedirles que apliquen nada por su cuenta';
  } else if (nivel === 'Avanzados') {
    progresionBloom = 'puedes saltarte los niveles básicos y avanzar directo a que analicen casos, comparen alternativas y evalúen decisiones ya tomadas sobre ' + tema;
  } else if (nivel === 'Nivel mixto') {
    progresionBloom = 'plantea el contenido en dos niveles desde el inicio: una base común de "comprender" para todo el grupo, y retos opcionales de "aplicar/analizar" para quienes ya traigan más experiencia — así nadie se aburre ni se pierde';
  } else {
    progresionBloom = 'puedes pasar rápido por "recordar/comprender" y centrar la mayor parte del tiempo en que apliquen ' + tema + ' a un caso o problema concreto';
  }
  var entregaModalidad;
  if (modalidad === 'Virtual (asíncrono)') {
    entregaModalidad = 'divide el contenido en videos o lecturas cortas (8–12 minutos cada una) con una pregunta de comprobación entre una y otra, en vez de un solo bloque largo — en asíncrono, los cortes frecuentes son lo que sostiene la atención.';
  } else if (modalidad === 'Virtual (síncrono / en vivo)') {
    entregaModalidad = 'alterna cada 10–15 minutos entre explicación e interacción breve (encuesta en vivo, chat, pregunta directa a alguien) — en videollamada, el silencio prolongado del facilitador es la principal causa de que la gente se desconecte mentalmente.';
  } else if (modalidad === 'Presencial') {
    entregaModalidad = 'apóyate en el pizarrón o rotafolio para construir el contenido en vivo junto con el grupo, en vez de solo proyectar diapositivas — en presencial, ver "pensar" al facilitador en tiempo real ayuda más que un contenido ya terminado.';
  } else if (modalidad === 'Híbrido') {
    entregaModalidad = 'diseña esta fase pensando primero en quienes están en línea (que son quienes más fácil se desconectan) y luego adapta para el grupo presencial — no al revés — para que ninguno de los dos grupos se sienta "la sede secundaria".';
  } else {
    entregaModalidad = 'define la modalidad antes de avanzar más en el diseño de esta fase, porque cambia por completo cómo conviene entregar el contenido (bloques cortos si es virtual, construcción en vivo si es presencial).';
  }
  var desarrolloTexto = 'Con el nivel de partida que describiste, ' + progresionBloom + ' (' + CITAS_DI.bloom + '). En cuanto a la entrega: ' + entregaModalidad;
  if (recursos === 'Ninguno todavía') {
    desarrolloTexto += ' Como todavía no tienes definida la plataforma o el espacio, resuelve primero ese punto — condiciona directamente qué tan viable es la progresión que se propone aquí.';
  }

  /* -- 3. Práctica y aplicación: provocar el desempeño y dar
   * retroalimentación (Gagné), sobre el ciclo de aprendizaje experiencial
   * de Kolb y el principio de aplicación de Merrill. -- */
  var practicaRecurso;
  if (recursos === 'Plataforma LMS propia') {
    practicaRecurso = 'usa tu LMS para un ejercicio auto-calificable o una simulación breve que ' + dirigidoMin + ' resuelvan por su cuenta';
  } else if (recursos === 'Videoconferencia (Zoom / Meet / Teams)') {
    practicaRecurso = 'usa salas simultáneas (breakout rooms) para que trabajen en equipos pequeños sobre un caso relacionado con ' + tema + ', y regresa a plenaria solo para que 1-2 equipos compartan su solución';
  } else if (recursos === 'Salón físico con proyector') {
    practicaRecurso = 'organiza un estudio de caso o role-play en equipos pequeños, con materiales impresos o en rotafolio — el proyector úsalo solo para mostrar instrucciones o resultados, no para que el grupo trabaje "hacia" la pantalla';
  } else {
    practicaRecurso = 'define primero qué recurso tendrás disponible para esta fase — la práctica es la parte del curso que más depende de la herramienta concreta con la que cuentes';
  }
  var practicaTexto = 'Después de que hayan visto el contenido, dales algo concreto que resolver antes de explicarles "la respuesta correcta": ' + practicaRecurso + '. El aprendizaje se consolida en el ciclo completo de experimentar, reflexionar sobre lo que pasó y volver a intentarlo con el ajuste — no solo con la exposición del contenido (' + CITAS_DI.kolb + '). Cierra esta fase con retroalimentación específica sobre lo que hicieron bien y qué ajustar, nunca solo con la respuesta correcta (' + CITAS_DI.merrill + ').';

  /* -- 4. Cierre y evaluación: evaluar el desempeño y favorecer la
   * retención/transferencia (Gagné), sobre el diseño hacia atrás de
   * Wiggins & McTighe y los objetivos medibles de Mager. -- */
  var cierreEvaluacion;
  if (evaluacion && /examen|prueba|cuestionario/i.test(evaluacion)) {
    cierreEvaluacion = 'ya tienes en mente un examen o cuestionario — súmale, si puedes, una pregunta de aplicación (no solo de memoria) que refleje una situación real de trabajo, para no medir solo si recordaron sino si podrían usarlo';
  } else if (evaluacion && /proyecto|practic/i.test(evaluacion)) {
    cierreEvaluacion = 'la idea de un proyecto o ejercicio práctico que ya tienes en mente es justo lo recomendable aquí: evalúa con una rúbrica breve y clara, compartida con el grupo desde el inicio del curso, no solo al final';
  } else if (evaluacion && /observ/i.test(evaluacion)) {
    cierreEvaluacion = 'la observación en el puesto que tienes en mente funciona bien si defines de antemano 2-3 señales concretas y observables de que el aprendizaje ocurrió — sin eso, la observación tiende a volverse subjetiva';
  } else {
    cierreEvaluacion = 'aún no tienes decidido cómo evaluar, así que empieza por ahí: define primero qué evidencia concreta te convencería de que ' + dirigidoMin + ' de verdad pueden ' + objetivo + ', y diseña la evaluación a partir de esa evidencia — no al revés';
  }
  var cierreTexto = 'La forma más confiable de diseñar esta fase es partir de la evidencia que buscas, no de la actividad: decide primero qué te convencería de que se logró el objetivo, y desde ahí arma la evaluación (' + CITAS_DI.wiggins + '). En tu caso, ' + cierreEvaluacion + '. Cierra siempre con una síntesis breve hecha por el propio grupo (no por ti) de lo aprendido, y con un compromiso concreto de cómo lo van a usar en los próximos días — es lo que más ayuda a que el aprendizaje se transfiera al trabajo real y no se quede en la sesión (' + CITAS_DI.mager + ').';

  return {
    apertura: aperturaTexto,
    desarrollo: desarrolloTexto,
    practica: practicaTexto,
    cierre: cierreTexto,
    duracionSugerida: _duracionSugerida(r.duracion)
  };
}

function progresoHtml() {
  var html = '<div class="progreso">';
  for (var i = 0; i < TOTAL_PASOS; i++) {
    var cls = i < state.paso ? 'hecho' : (i === state.paso ? 'actual' : '');
    html += '<div class="paso ' + cls + '"></div>';
  }
  return html + '</div>';
}

function render() {
  if (state.paso === 0) return renderDatos();
  if (state.paso === 1) return renderPreguntas();
  return renderResultado();
}

/* ---- PASO 0: datos de la organización (antes de la prueba) ---- */
function renderDatos() {
  var d = state.datos || {};
  app.innerHTML =
    progresoHtml() +
    '<h1>Diseño Instruccional de Cursos</h1>' +
    '<p class="subtle">10 preguntas breves sobre el curso que quieres desarrollar — menos de 5 minutos. Primero necesitamos algunos datos de tu organización para poder enviarte la propuesta.</p>' +
    '<div id="secMsg"></div>' +
    '<form id="datosForm">' +
      '<label>Nombre completo <span class="req">*</span></label><input type="text" id="dNombre" value="' + escapeHtml(d.nombre || '') + '">' +
      '<label>Organización <span class="req">*</span></label><input type="text" id="dOrganizacion" value="' + escapeHtml(d.organizacion || '') + '">' +
      '<label>Categoría <span class="req">*</span></label>' +
      '<select id="dCategoria">' +
        '<option value="">Selecciona una opción</option>' +
        CATEGORIAS_CRM_OPCIONES.map(function (c) {
          return '<option' + (d.categoria === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
        }).join('') +
      '</select>' +
      '<label>Correo electrónico <span class="req">*</span></label><input type="email" id="dEmail" placeholder="nombre@tuorganizacion.com" value="' + escapeHtml(d.email || '') + '">' +
      '<label>Teléfono (opcional)</label><input type="text" id="dTelefono" value="' + escapeHtml(d.telefono || '') + '">' +
      '<label>Cargo (opcional)</label><input type="text" id="dCargo" value="' + escapeHtml(d.cargo || '') + '">' +
      '<input type="text" id="dTrampa" class="campo-trampa" tabindex="-1" autocomplete="off">' +
    '</form>' +
    '<div class="fila-botones"><button class="primary" id="btnSiguiente">Continuar al cuestionario →</button></div>';

  document.getElementById('btnSiguiente').onclick = function () {
    var msgBox = document.getElementById('secMsg');
    var nombre = document.getElementById('dNombre').value.trim();
    var organizacion = document.getElementById('dOrganizacion').value.trim();
    var categoria = document.getElementById('dCategoria').value;
    var email = document.getElementById('dEmail').value.trim();
    if (!nombre || !organizacion) { msgBox.innerHTML = '<div class="msg error">Escribe tu nombre y el de tu organización.</div>'; return; }
    if (!categoria) { msgBox.innerHTML = '<div class="msg error">Selecciona una categoría.</div>'; return; }
    if (!email || email.indexOf('@') === -1) { msgBox.innerHTML = '<div class="msg error">Escribe un correo electrónico válido.</div>'; return; }

    state.datos = {
      nombre: nombre, organizacion: organizacion, categoria: categoria, email: email,
      telefono: document.getElementById('dTelefono').value.trim(),
      cargo: document.getElementById('dCargo').value.trim(),
      sitioWebTrampa: document.getElementById('dTrampa').value
    };
    state.paso = 1;
    render();
  };
}

/* ---- PASO 1: 10 preguntas mixtas sobre el curso ---- */
function renderPreguntas() {
  var preguntasHtml = PREGUNTAS_DI.map(function (p, i) {
    var bloque = '<div class="pregunta-di" data-campo="' + p.campo + '">' +
      '<div class="num">Pregunta ' + (i + 1) + ' de ' + PREGUNTAS_DI.length + (p.opcional ? ' · opcional' : '') + '</div>' +
      '<div class="pregunta-texto">' + escapeHtml(p.q) + '</div>' +
      (p.hint ? '<div class="pregunta-hint">' + escapeHtml(p.hint) + '</div>' : '');
    if (p.tipo === 'select') {
      var opcionesHtml = p.opciones.map(function (op) {
        var marcada = state.respuestas[p.campo] === op;
        return '<button type="button" class="op-choice' + (marcada ? ' marcada' : '') + '" data-campo="' + p.campo + '" data-valor="' + escapeHtml(op) + '">' + escapeHtml(op) + '</button>';
      }).join('');
      bloque += '<div class="opciones-di">' + opcionesHtml + '</div>';
    } else {
      bloque += '<textarea data-campo-texto="' + p.campo + '" placeholder="Escribe tu respuesta aquí...">' + escapeHtml(state.respuestas[p.campo] || '') + '</textarea>';
    }
    return bloque + '</div>';
  }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>10 preguntas sobre tu curso</h2>' +
    '<p class="subtle" style="margin-top:0">Entre más detalle nos des, más útil será la propuesta que te generemos.</p>' +
    '<div id="secMsg"></div>' +
    preguntasHtml +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnVerResultado">Ver mi propuesta de secuencia →</button>' +
    '</div>';

  Array.prototype.forEach.call(app.querySelectorAll('.op-choice'), function (btn) {
    btn.onclick = function () {
      var campo = btn.getAttribute('data-campo');
      var valor = btn.getAttribute('data-valor');
      state.respuestas[campo] = valor;
      var grupo = app.querySelector('.pregunta-di[data-campo="' + campo + '"]');
      Array.prototype.forEach.call(grupo.querySelectorAll('.op-choice'), function (b) { b.classList.remove('marcada'); });
      btn.classList.add('marcada');
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll('textarea[data-campo-texto]'), function (ta) {
    ta.oninput = function () { state.respuestas[ta.getAttribute('data-campo-texto')] = ta.value; };
  });

  document.getElementById('btnAtras').onclick = function () { state.paso = 0; render(); };
  document.getElementById('btnVerResultado').onclick = function () {
    var faltantes = PREGUNTAS_DI.filter(function (p) { return !p.opcional && !String(state.respuestas[p.campo] || '').trim(); });
    if (faltantes.length) {
      document.getElementById('secMsg').innerHTML = '<div class="msg error">Responde las preguntas obligatorias antes de continuar (falta' + (faltantes.length > 1 ? 'n' : '') + ' ' + faltantes.length + ').</div>';
      return;
    }

    // La propuesta se genera al instante con reglas fijas (secuenciaReglas,
    // más abajo) — igual que el resto de la plataforma, ya NO depende de
    // que Gemini responda a tiempo (antes se veía una pantalla de espera
    // de varios segundos y, si la IA fallaba o tardaba, la persona se
    // quedaba con un mensaje de disculpa en vez de una propuesta real).
    state.secuencia = secuenciaReglas(state.datos || {}, state.respuestas);
    state.paso = 2;
    render();

    // El registro del lead y el correo con el resultado se mandan de
    // inmediato también, sin bloquear la pantalla — ver el comentario en
    // _enviarResultadoMuestraCorreo.
    var d = state.datos || {};
    var resumenNotas = 'Diseño instruccional — ' + PREGUNTAS_DI.map(function (p) {
      return p.q + ' ' + (state.respuestas[p.campo] || '(sin responder)');
    }).join(' | ');
    jsonp('capturarClienteDiagnostico', {
      organizacion: d.organizacion,
      categoria: d.categoria,
      ejeInteres: 'Educación',
      nombreContacto: d.nombre,
      cargo: d.cargo,
      correo: d.email,
      telefono: d.telefono,
      leadMagnet: 'Diseño Instruccional de Cursos',
      consentimiento: 'Sí',
      notas: resumenNotas.slice(0, 1500),
      respuestasCompletas: JSON.stringify(state.respuestas),
      sitioWebTrampa: d.sitioWebTrampa
    });
    _enviarResultadoMuestraCorreo();
  };
}

/* ---- PASO 2: resultado — propuesta de secuencia didáctica ---- */
function renderResultado() {
  var d = state.datos || {};
  var secuenciaHtml;
  if (state.secuencia) {
    secuenciaHtml = FASES_SECUENCIA.map(function (f) {
      return '<div class="secuencia-fase">' +
        '<div class="num-fase">Fase ' + f.numero + ' — ' + f.titulo + '</div>' +
        '<p>' + escapeHtml(state.secuencia[f.clave] || '') + '</p>' +
      '</div>';
    }).join('') +
    (state.secuencia.duracionSugerida
      ? '<div class="secuencia-duracion"><b>Duración sugerida:</b> ' + escapeHtml(state.secuencia.duracionSugerida) + '</div>'
      : '');
  } else {
    secuenciaHtml = '<p class="subtle">No pudimos generar la propuesta automática en este momento — de cualquier forma, ya recibimos tus respuestas y alguien del equipo te escribirá con una propuesta hecha a mano.</p>';
  }

  app.innerHTML =
    progresoHtml() +
    '<h2>Propuesta de secuencia didáctica</h2>' +
    '<p class="subtle" style="margin-top:0">Para ' + escapeHtml(d.organizacion || 'tu organización') + ' — generada con ayuda de IA a partir de tus respuestas. Este es un borrador preliminar; el diseño final se afina contigo.</p>' +
    secuenciaHtml +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnDescargarPdf">Descargar propuesta en PDF</button>' +
    '</div>' +
    '<div id="correoAviso"></div>' +
    '<div class="cta">' +
      '<h2>¿Quieres desarrollar este curso con nosotros?</h2>' +
      '<p>Esta es una propuesta preliminar automática. Haz tu cita y afinamos juntos el diseño instruccional completo.</p>' +
      '<div class="fila-botones">' +
        '<a class="boton-cta solido" href="https://calendly.com/sintropiassociales/30min" target="_blank" rel="noopener">Haz tu cita</a>' +
        '<a class="boton-cta contorno" href="mailto:comunicacion@sintropiasocial.com">Escríbenos</a>' +
      '</div>' +
    '</div>';

  document.getElementById('btnDescargarPdf').onclick = function () { descargarSecuenciaPdf(); };
  _enviarResultadoMuestraCorreo();
}

/* ---- Correo automático con el resultado (PDF adjunto + oferta con IA) ----
 * A diferencia de otras muestras, aquí la "secuencia" YA es el contenido
 * generado con IA (no hay una interpretación aparte) — se manda tal cual
 * apenas se muestra, una sola vez. Se manda de cualquier forma aunque la
 * propuesta automática haya fallado (con un resumen genérico en su lugar) —
 * la persona de cualquier forma ya quedó registrada como lead y espera
 * noticias por correo. */
// Arma los parámetros para generarInterpretacionMuestra — el procesador en
// segundo plano los usa para generar una sección adicional de
// "Recomendaciones" con IA (ver rama 'DisenioInstruccional' en
// apiGenerarInterpretacionMuestra, WebApp.gs) que complementa — nunca
// sustituye — la propuesta de secuenciaReglas().
function _paramsInterpretacionIA() {
  var d = state.datos || {}, r = state.respuestas || {};
  var secuenciaTexto = state.secuencia ? FASES_SECUENCIA.map(function (f) {
    return f.titulo + ': ' + (state.secuencia[f.clave] || '');
  }).join(' ') : '';
  return {
    muestra: 'DisenioInstruccional',
    nombre: d.nombre,
    email: d.email,
    modalidad: r.modalidad,
    tema: r.tema,
    dirigido: r.dirigido,
    necesidad: r.necesidad,
    duracion: r.duracion,
    nivel: r.nivel,
    objetivo: r.objetivo,
    recursos: r.recursos,
    evaluacion: r.evaluacion,
    notas: r.notas,
    secuenciaPrevia: secuenciaTexto,
    sitioWebTrampa: d.sitioWebTrampa
  };
}

/* ---- Correo automático con el resultado (PDF adjunto + oferta con IA) ----
 * Se dispara de inmediato al ver la propuesta — ya no depende de ninguna
 * respuesta de IA (secuenciaReglas es instantánea). Se manda
 * paramsInterpretacionIA para que el procesador en segundo plano intente
 * sumar, del lado del servidor, una sección de "Recomendaciones" con IA —
 * si eso falla o tarda, el correo sale de todas formas con la propuesta
 * completa de secuenciaReglas, nunca con un mensaje de disculpa vacío. */
function _enviarResultadoMuestraCorreo() {
  if (state.correoResultadoEnviado) return;
  state.correoResultadoEnviado = true;
  var d = state.datos || {};
  var secciones, resumenTexto;
  if (state.secuencia) {
    secciones = FASES_SECUENCIA.map(function (f) {
      return { titulo: f.titulo, parrafos: [state.secuencia[f.clave] || ''] };
    });
    if (state.secuencia.duracionSugerida) secciones.push({ titulo: 'Duración sugerida', parrafos: [state.secuencia.duracionSugerida] });
    resumenTexto = FASES_SECUENCIA.map(function (f) {
      return f.titulo + ': ' + (state.secuencia[f.clave] || '');
    }).join(' ');
  } else {
    secciones = [{ titulo: 'Tu propuesta preliminar', parrafos: ['No pudimos generar automáticamente la propuesta esta vez — el equipo de Sintropía Social la preparará a mano y te la compartirá pronto.'] }];
    resumenTexto = 'La propuesta automática de secuencia didáctica no se pudo generar; el equipo la preparará a mano.';
  }
  jsonpPost('enviarResultadoMuestra', {
    tipoMuestra: 'DisenioInstruccional',
    nombre: d.nombre,
    correo: d.email,
    organizacion: d.organizacion,
    tituloResultado: 'Propuesta de secuencia didáctica',
    resumenTexto: resumenTexto,
    secciones: JSON.stringify(secciones),
    paramsInterpretacionIA: JSON.stringify(_paramsInterpretacionIA()),
    sitioWebTrampa: d.sitioWebTrampa
  }).then(function (resp) {
    var aviso = document.getElementById('correoAviso');
    if (!aviso) return;
    if (resp && resp.ok) {
      aviso.innerHTML = '<div style="background:var(--bg);border:1px solid rgba(99,30,235,.18);border-radius:9px;padding:10px 13px;font-size:13.5px;color:var(--text);margin:12px 0;">Te enviamos esta propuesta a <b>' + escapeHtml(d.email) + '</b>.</div>';
    } else {
      aviso.innerHTML = '<div class="msg error">No pudimos enviarte el correo con tu propuesta' +
        (resp && resp.error ? (': ' + escapeHtml(resp.error)) : ' — intenta de nuevo más tarde') +
        '. Mientras tanto puedes descargarla en PDF aquí arriba.</div>';
    }
  });
}

/* ---- Descargable en PDF ---- */
function descargarSecuenciaPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.');
    return;
  }
  var d = state.datos || {};
  var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  var purple = [99, 30, 235];
  var margenIzq = 44, anchoTexto = 524, y;

  doc.setFillColor(purple[0], purple[1], purple[2]);
  doc.rect(0, 0, 612, 64, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text('Sintropía Social — Diseño Instruccional de Cursos', margenIzq, 40);

  y = 94;
  doc.setTextColor(30, 30, 30);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text('Propuesta de secuencia didáctica — ' + (d.organizacion || ''), margenIzq, y);
  y += 24;

  doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
  doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 18;

  var alturaLinea = 12.5, alturaPagina = 730;
  if (state.secuencia) {
    FASES_SECUENCIA.forEach(function (f) {
      if (y > alturaPagina - 30) { doc.addPage(); y = 50; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
      doc.setTextColor(purple[0], purple[1], purple[2]);
      doc.text(f.titulo.toUpperCase(), margenIzq, y);
      y += 15;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
      doc.setTextColor(50, 50, 50);
      var lineas = doc.splitTextToSize(state.secuencia[f.clave] || '', anchoTexto);
      for (var i = 0; i < lineas.length; i++) {
        if (y > alturaPagina) { doc.addPage(); y = 50; }
        doc.text(lineas[i], margenIzq, y);
        y += alturaLinea;
      }
      y += 8;
    });
    if (state.secuencia.duracionSugerida) {
      if (y > alturaPagina - 30) { doc.addPage(); y = 50; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
      doc.setTextColor(purple[0], purple[1], purple[2]);
      doc.text('DURACIÓN SUGERIDA', margenIzq, y);
      y += 15;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
      doc.setTextColor(50, 50, 50);
      var lineasDur = doc.splitTextToSize(state.secuencia.duracionSugerida, anchoTexto);
      doc.text(lineasDur, margenIzq, y);
      y += lineasDur.length * alturaLinea + 8;
    }
  } else {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    doc.setTextColor(50, 50, 50);
    doc.text('No se generó una propuesta automática. El equipo de Sintropía Social te contactará con una propuesta hecha a mano.', margenIzq, y, { maxWidth: anchoTexto });
    y += 20;
  }

  if (y > alturaPagina - 40) { doc.addPage(); y = 50; }
  y += 10;
  doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 18;
  // Enlace de verdad (clickeable dentro del PDF) en vez de la URL como texto
  // plano — un PDF no vuelve clickeable una URL solo por escribirla.
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.setTextColor(107, 107, 120);
  doc.text('¿Quieres desarrollar este curso con nosotros?', margenIzq, y, { maxWidth: anchoTexto });
  y += 14;
  doc.setTextColor(99, 30, 235);
  var etiquetaCitaDi = 'Haz tu cita aquí';
  doc.textWithLink(etiquetaCitaDi, margenIzq, y, { url: 'https://calendly.com/sintropiassociales/30min' });
  var anchoCitaDi = doc.getTextWidth(etiquetaCitaDi);
  doc.setDrawColor(99, 30, 235); doc.setLineWidth(0.4);
  doc.line(margenIzq, y + 1.5, margenIzq + anchoCitaDi, y + 1.5);
  doc.setTextColor(107, 107, 120);
  doc.text(' o escríbenos a comunicacion@sintropiasocial.com.', margenIzq + anchoCitaDi, y);

  doc.save('diseno-instruccional-sintropia.pdf');
}

render();
