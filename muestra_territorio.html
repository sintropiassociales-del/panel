<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mapa territorial gratuito — ubica tu proyecto, mapea tus actores clave y descubre qué tan bien conoces tu territorio. Muestra gratuita de Sintropía Social.">
<title>Mapa territorial — Sintropía Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --purple: #631EEB;
    --purple-dark: #4E17B8;
    --orange: #FF7929;
    --bg: #F5F3FC;
    --card: #FFFFFF;
    --text: #2C2C2C;
    --subtle: #6B6B78;
    --border: #E6E2F5;
    --error: #C0392B;
    --error-bg: #FDECEA;
    --verde: #1E8449; --verde-bg: #EAF7EE; --verde-luz: #22C55E;
    --amarillo: #B7770A; --amarillo-bg: #FEF6E0; --amarillo-luz: #FBBF24;
    --rojo: #C0392B; --rojo-bg: #FDECEA; --rojo-luz: #E63946;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Open Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
  }
  header.top {
    background: var(--purple); color: #fff; padding: 26px 18px 44px; text-align: center;
    border-radius: 0 0 22px 22px;
  }
  header.top .marca { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  header.top .marca span { color: var(--orange); }
  header.top .subt { font-size: 13.5px; opacity: .92; margin-top: 6px; max-width: 460px; margin-left: auto; margin-right: auto; }
  main { max-width: 660px; margin: -26px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 26px 24px; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(99,30,235,.08); border: 1px solid var(--border);
  }
  h1 { font-size: 21px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 4px; color: var(--purple-dark); }
  h3 { font-size: 15px; margin: 22px 0 2px; color: var(--purple-dark); }
  p.subtle, .subtle { color: var(--subtle); font-size: 13.5px; }
  .progreso { display: flex; gap: 6px; margin: 18px 0 22px; }
  .progreso .paso { flex: 1; height: 6px; border-radius: 4px; background: var(--border); }
  .progreso .paso.hecho { background: var(--orange); }
  .progreso .paso.actual { background: var(--purple); }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 5px; }
  label .req { color: var(--orange); }
  label .opc { color: var(--subtle); font-weight: 400; }
  input[type=text], input[type=email], select, textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  .fila-botones { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px;
    padding: 12px 24px; border: none; cursor: pointer;
  }
  button.primary { background: var(--purple); color: #fff; }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  button.tenue { background: #FAF8FF; color: var(--purple-dark); border: 1.5px dashed var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { padding: 10px 13px; border-radius: 9px; font-size: 13.5px; margin: 12px 0; }
  .msg.error { background: var(--error-bg); color: var(--error); }

  /* Consentimiento + honeypot */
  .consentimiento { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; background: #FAF8FF;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .consentimiento input { margin-top: 3px; width: auto; }
  .consentimiento label { margin: 0; font-weight: 400; font-size: 13px; }
  .campo-trampa { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; overflow: hidden; }

  /* Paso mapa */
  #mapaLeaflet, #mapaRecap, #mapaActores { width: 100%; height: 280px; border-radius: 12px; border: 1.5px solid var(--border); }
  #mapaRecap { height: 220px; margin-bottom: 4px; }
  #mapaActores { height: 260px; margin-top: 12px; }
  .mapa-ficha { background: #FAF8FF; border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px;
    font-size: 13px; color: var(--subtle); margin-top: 10px; }
  .mapa-ficha b { color: var(--text); }

  /* Marcadores numerados de actores + marcador del proyecto, en los mapas Leaflet */
  .punto-actor-mapa { width: 26px; height: 26px; border-radius: 50%; background: var(--purple); color: #fff;
    font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(99,30,235,.35); border: 2px solid #fff; }
  .punto-proyecto-mapa { width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #fff;
    font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 7px rgba(255,121,41,.45); border: 2px solid #fff; }

  /* Preguntas por dimensión (reactivos) */
  .bloque-categoria { margin-bottom: 26px; }
  .bloque-categoria .num-bloque { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
    color: var(--purple); text-transform: uppercase; margin-bottom: 2px; }
  .bloque-categoria .nombre-categoria { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
  .pregunta-riesgo { border-top: 1px solid var(--border); padding: 16px 0; }
  .pregunta-riesgo:first-of-type { border-top: none; padding-top: 4px; }
  .pregunta-texto { font-size: 14.5px; font-weight: 600; margin-bottom: 10px; }
  .opciones-riesgo { display: flex; gap: 8px; flex-wrap: wrap; }
  .op-choice {
    flex: 1; min-width: 90px; border: 1.5px solid var(--border); border-radius: 9px; background: #fff;
    color: var(--subtle); font-weight: 600; font-size: 12.5px; padding: 10px 6px; cursor: pointer; text-align: center;
    transition: background .12s, border-color .12s, color .12s;
  }
  .op-choice.marcada { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* Matriz de actores */
  .actor-fila { border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; position: relative; }
  .actor-fila .quitar { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--subtle);
    font-size: 18px; padding: 0; cursor: pointer; line-height: 1; }
  .actor-fila .quitar:hover { color: var(--error); }
  .actor-fila label { margin-top: 10px; }
  .actor-fila label:first-of-type { margin-top: 0; }
  .cuadrante-wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
  .cuadrante-columna { display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto; }
  .cuadrante-fila { display: flex; gap: 6px; }
  .cuadrante-box { position: relative; width: 240px; height: 240px; flex: 0 0 240px; background: #fff;
    border: 1.5px solid var(--border); border-radius: 10px; }
  .cuadrante-box::before, .cuadrante-box::after { content: ''; position: absolute; background: var(--border); }
  .cuadrante-box::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .cuadrante-box::after { top: 50%; left: 0; right: 0; height: 1px; }
  .cuadrante-etiqueta { position: absolute; font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; color: var(--subtle); max-width: 96px; line-height: 1.25; }
  .cuadrante-etiqueta.tl { top: 6px; left: 6px; }
  .cuadrante-etiqueta.tr { top: 6px; right: 6px; text-align: right; }
  .cuadrante-etiqueta.bl { bottom: 6px; left: 6px; }
  .cuadrante-etiqueta.br { bottom: 6px; right: 6px; text-align: right; }
  .cuadrante-eje-y, .cuadrante-eje-x { font-size: 9.5px; font-weight: 700; color: var(--purple); text-transform: uppercase; letter-spacing: .4px; }
  .cuadrante-eje-y { flex: 0 0 14px; writing-mode: vertical-rl; transform: rotate(180deg); display: flex;
    align-items: center; justify-content: center; }
  .cuadrante-eje-x { text-align: center; padding-left: 20px; }
  .punto-actor { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--purple);
    color: #fff; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%); box-shadow: 0 2px 6px rgba(99,30,235,.35); border: 2px solid #fff; }
  .leyenda-actores { flex: 1; min-width: 200px; }
  .leyenda-item { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; margin-bottom: 10px; }
  .leyenda-num { flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--purple); color: #fff;
    font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .leyenda-item .nombre { font-weight: 700; }
  .leyenda-item .estrategia { color: var(--purple-dark); font-weight: 600; }

  /* Resultado */
  .banda-box { text-align: center; padding: 8px 4px 4px; }
  .banda-luz {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin-right: 8px; vertical-align: middle;
  }
  .banda-luz.verde { background: var(--verde-luz); }
  .banda-luz.amarillo { background: var(--amarillo-luz); }
  .banda-luz.rojo { background: var(--rojo-luz); }
  .banda-etiqueta {
    display: inline-block; font-size: 15px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase;
    vertical-align: middle;
  }
  .banda-etiqueta.verde { color: var(--verde); }
  .banda-etiqueta.amarillo { color: var(--amarillo); }
  .banda-etiqueta.rojo { color: var(--rojo); }
  .banda-puntaje { font-size: 13px; color: var(--subtle); margin: 6px 0 0; }

  .categoria-resultado { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .categoria-resultado .nombre { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .barra-riesgo { height: 8px; border-radius: 5px; background: var(--border); overflow: hidden; margin-bottom: 4px; }
  .barra-riesgo .relleno { height: 100%; border-radius: 5px; }
  .barra-riesgo .relleno.baja { background: var(--rojo-luz); }
  .barra-riesgo .relleno.media { background: var(--amarillo-luz); }
  .barra-riesgo .relleno.alta { background: var(--verde-luz); }

  .cta { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff; border-radius: 14px;
    padding: 22px 24px; margin-top: 8px; }
  .cta h2 { color: #fff; }
  .cta p { font-size: 13.5px; opacity: .95; }
  .cta a { color: #fff; font-weight: 700; }
  .cta .fila-botones a.boton-cta {
    display: inline-block; text-decoration: none; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 14px;
  }
  .cta .boton-cta.solido { background: #fff; color: var(--purple-dark); }
  .cta .boton-cta.contorno { border: 1.5px solid rgba(255,255,255,.7); color: #fff; }

  footer.pie { text-align: center; font-size: 12px; color: var(--subtle); padding: 10px 16px 34px; }
  footer.pie .wordmark { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  footer.pie a { color: var(--purple); text-decoration: none; }
</style>
</head>

  <div class="marca">Sintropía <span>Social</span></div>
  <div class="subt">Mapa territorial — ubica tu proyecto, mapea a tus actores clave y descubre qué tan bien conoces tu territorio</div>
</header>

function jsonp(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;

    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }

    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }

// Variante de jsonp() que manda los parámetros por POST (cuerpo de la

function jsonpPost(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' });
    }, timeoutMs || 25000);
    var body = { action: action };
    params = params || {};
    for (var k in params) { if (params[k] !== undefined && params[k] !== null) body[k] = params[k]; }
    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },

      clearTimeout(timer);

}

function _bandaTerritorio(puntaje) {
  if (puntaje <= 9) return { clave: 'rojo', etiqueta: 'Territorio por mapear', claseCss: 'rojo' };
  if (puntaje <= 19) return { clave: 'amarillo', etiqueta: 'Mapeo en construcción', claseCss: 'amarillo' };
  return { clave: 'verde', etiqueta: 'Territorio bien mapeado', claseCss: 'verde' };
}

function _nivelBarraTer(sub, max) {
  var pct = sub / max;
  if (pct <= 0.33) return 'baja';
  if (pct <= 0.66) return 'media';
  return 'alta';
}

/* ---- Estrategia de involucramiento por cuadrante (matriz poder-interés) ----
 * "Media" se trata como del lado alto de su eje (>= 0.5) — una simplificación
 * razonable para una matriz de 2x2 con solo 3 niveles por eje. */
var NIVEL_FRACCION = { 'Baja': 0.15, 'Media': 0.5, 'Alta': 0.85 };
function _estrategiaCuadrante(influencia, interes) {
  var ladoAltoInf = (NIVEL_FRACCION[influencia] || 0) >= 0.5;
  var ladoAltoInt = (NIVEL_FRACCION[interes] || 0) >= 0.5;
  if (ladoAltoInf && ladoAltoInt) return 'Gestionar de cerca';
  if (ladoAltoInf && !ladoAltoInt) return 'Mantener satisfecho';
  if (!ladoAltoInf && ladoAltoInt) return 'Mantener informado';
  return 'Monitorear';
}

/* Reparte actores sin ubicación propia alrededor del proyecto, en espiral
 * (ángulo dorado) para que no queden encimados, como posición inicial que
 * la persona puede luego arrastrar a donde corresponda. */
function _offsetActorLatLng(lat, lng, i) {
  var angulo = i * 2.399963;
  var radio = 0.006 + i * 0.0015;
  return [lat + radio * Math.cos(angulo), lng + radio * Math.sin(angulo) / Math.cos(lat * Math.PI / 180)];
}

    if (!nombre || !organizacion) { msgBox.innerHTML = '<div class="msg error">Escribe tu nombre y el de tu organización.</div>'; return; }
    if (!categoria) { msgBox.innerHTML = '<div class="msg error">Selecciona una categoría.</div>'; return; }
    if (!email || email.indexOf('@') === -1) { msgBox.innerHTML = '<div class="msg error">Escribe un correo electrónico válido.</div>'; return; }
    if (!estado || !municipio) { msgBox.innerHTML = '<div class="msg error">Selecciona el estado y el municipio del territorio de tu proyecto.</div>'; return; }
    if (!consentimiento) { msgBox.innerHTML = '<div class="msg error">Necesitamos tu autorización para poder contactarte con tu resultado.</div>'; return; }

    var estadoCambio = (d.estado || '') !== estado;
    state.datos = {
      nombre: nombre, organizacion: organizacion, categoria: categoria, email: email,
      telefono: document.getElementById('dTelefono').value.trim(),
      cargo: document.getElementById('dCargo').value.trim(),
      estado: estado, municipio: municipio,
      colonia: document.getElementById('dColonia').value.trim(),
      cp: document.getElementById('dCp').value.trim(),
      consentimiento: true,
      sitioWebTrampa: document.getElementById('dTrampa').value
    };
    // Si cambió el estado, recentra el mapa la próxima vez que se muestre.
    if (estadoCambio) state.ubicacion = null;
    state.paso = 1;
    render();
  };
}

/* ---- PASO 1: mapa — marca la ubicación aproximada del proyecto ---- */
function renderMapa() {
  var d = state.datos || {};
  app.innerHTML =
    progresoHtml() +
    '<h2>Ubica tu territorio en el mapa</h2>' +
    '<p class="subtle" style="margin-top:0">Da clic en el mapa o arrastra el marcador hasta la ubicación aproximada de tu proyecto en ' + escapeHtml(d.municipio || '') + ', ' + escapeHtml(d.estado || '') + '. No necesita ser exacta.</p>' +
    '<div id="mapaLeaflet"></div>' +
    '<div class="mapa-ficha" id="mapaFicha"></div>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnSiguiente">Continuar a los actores →</button>' +
    '</div>';

  var centro = (state.ubicacion && state.ubicacion.tocado) ?
    [state.ubicacion.lat, state.ubicacion.lng] :
    (ESTADO_CENTROS[d.estado] || CENTRO_MEXICO);
  var zoomInicial = (state.ubicacion && state.ubicacion.tocado) ? 13 : 8;

  if (mapaLeaflet) { mapaLeaflet.remove(); mapaLeaflet = null; marcadorLeaflet = null; }
  mapaLeaflet = L.map('mapaLeaflet').setView(centro, zoomInicial);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(mapaLeaflet);
  marcadorLeaflet = L.marker(centro, { draggable: true, icon: _iconoProyecto() }).addTo(mapaLeaflet);

  function actualizarUbicacion(lat, lng, tocado) {
    state.ubicacion = { lat: lat, lng: lng, tocado: !!tocado };
    var ficha = document.getElementById('mapaFicha');
    if (ficha) {
      ficha.innerHTML = tocado ?
        ('<b>Marcador colocado</b> — ' + lat.toFixed(4) + ', ' + lng.toFixed(4)) :
        'Aún no has movido el marcador — está sobre el centro aproximado de ' + escapeHtml(d.estado || 'tu estado') + '. Da clic donde esté tu proyecto para precisarlo.';
    }
  }
  actualizarUbicacion(centro[0], centro[1], state.ubicacion && state.ubicacion.tocado);

  mapaLeaflet.on('click', function (e) {
    marcadorLeaflet.setLatLng(e.latlng);
    actualizarUbicacion(e.latlng.lat, e.latlng.lng, true);
  });
  marcadorLeaflet.on('dragend', function () {
    var pos = marcadorLeaflet.getLatLng();
    actualizarUbicacion(pos.lat, pos.lng, true);
  });

  document.getElementById('btnAtras').onclick = function () { state.paso = 0; render(); };
  document.getElementById('btnSiguiente').onclick = function () { state.paso = 2; render(); };
}

/* ---- Matriz de actores (poder-interés): construcción del HTML del
 * cuadrante + leyenda, reutilizada en el paso 2 (vista previa en vivo) y
 * en el paso 4 (recap del resultado). ---- */
function actoresValidos() {
  return state.actores.filter(function (a) { return a.nombre.trim() && a.influencia && a.interes; });
}

function renderCuadranteHtml(actores) {
  if (!actores.length) {
    return '<p class="subtle">Agrega al menos 3 actores con nombre, influencia e interés para ver tu matriz.</p>';
  }
  var puntosHtml = actores.map(function (a, i) {
    var x = NIVEL_FRACCION[a.interes] * 100;
    var y = (1 - NIVEL_FRACCION[a.influencia]) * 100;
    return '<div class="punto-actor" style="left:' + x + '%;top:' + y + '%" title="' + escapeHtml(a.nombre) + '">' + (i + 1) + '</div>';
  }).join('');
  var leyendaHtml = actores.map(function (a, i) {
    var estrategia = _estrategiaCuadrante(a.influencia, a.interes);
    return '<div class="leyenda-item">' +
      '<div class="leyenda-num">' + (i + 1) + '</div>' +
      '<div><div class="nombre">' + escapeHtml(a.nombre) + '</div>' +
      '<div class="subtle">' + escapeHtml(a.tipo || 'Sin tipo') + ' · Influencia ' + escapeHtml(a.influencia) + ' · Interés ' + escapeHtml(a.interes) + '</div>' +
      '<div class="estrategia">' + escapeHtml(estrategia) + '</div></div>' +
    '</div>';
  }).join('');
  return '<div class="cuadrante-wrap">' +
    '<div class="cuadrante-columna">' +
      '<div class="cuadrante-fila">' +
        '<div class="cuadrante-eje-y">Influencia →</div>' +
        '<div class="cuadrante-box">' +
          '<div class="cuadrante-etiqueta tl">Mantener satisfecho</div>' +
          '<div class="cuadrante-etiqueta tr">Gestionar de cerca</div>' +
          '<div class="cuadrante-etiqueta bl">Monitorear</div>' +
          '<div class="cuadrante-etiqueta br">Mantener informado</div>' +
          puntosHtml +
        '</div>' +
      '</div>' +
      '<div class="cuadrante-eje-x">Interés →</div>' +
    '</div>' +
    '<div class="leyenda-actores">' + leyendaHtml + '</div>' +
  '</div>';
}

function resumenActoresTexto(actores) {
  if (!actores.length) return '';
  return actores.map(function (a) {
    var estrategia = _estrategiaCuadrante(a.influencia, a.interes);
    return a.nombre + ' (' + (a.tipo || 'sin tipo') + ' — influencia ' + a.influencia + ', interés ' + a.interes + ' — ' + estrategia + ')';
  }).join('; ');
}

/* ---- PASO 2: carga de actores clave ---- */
function renderActores() {
  var filasHtml = state.actores.map(function (a, i) {
    return '<div class="actor-fila" data-idx="' + i + '">' +
      (state.actores.length > 3 ? '<button type="button" class="quitar" data-idx="' + i + '" title="Quitar">×</button>' : '') +
      '<label>Nombre del actor o recurso <span class="req">*</span></label>' +
      '<input type="text" class="actNombre" data-idx="' + i + '" placeholder="ej. Ayuntamiento de..., líder comunitario, ONG local" value="' + escapeHtml(a.nombre) + '">' +
      '<label>Tipo <span class="opc">(opcional)</span></label>' +
      '<select class="actTipo" data-idx="' + i + '">' +
        '<option value="">Selecciona un tipo</option>' +
        TIPOS_ACTOR_TER.map(function (t) { return '<option' + (a.tipo === t ? ' selected' : '') + '>' + escapeHtml(t) + '</option>'; }).join('') +
      '</select>' +
      '<div class="row2">' +
        '<div><label>Nivel de influencia <span class="req">*</span></label><select class="actInfluencia" data-idx="' + i + '">' +
          '<option value="">Selecciona</option>' +
          NIVELES_ACTOR_TER.map(function (n) { return '<option' + (a.influencia === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
        '</select></div>' +
        '<div><label>Nivel de interés <span class="req">*</span></label><select class="actInteres" data-idx="' + i + '">' +
          '<option value="">Selecciona</option>' +
          NIVELES_ACTOR_TER.map(function (n) { return '<option' + (a.interes === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
    '</div>';
  }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>¿Quiénes son los actores clave de tu territorio?</h2>' +
    '<p class="subtle" style="margin-top:0">Carga al menos 3 — autoridades, organizaciones, líderes, empresas o recursos relevantes. Con esto armamos tu matriz de poder-interés (la misma lógica de INS-TER-01, el instrumento real de la Plataforma Sintropía) y los ubicamos en el mapa junto a tu proyecto.</p>' +
    '<div id="secMsg"></div>' +
    '<div id="filasActores">' + filasHtml + '</div>' +
    '<button type="button" class="tenue" id="btnAgregarActor" style="width:100%;margin-top:4px">+ Agregar otro actor</button>' +
    '<h3>Ubica a tus actores en el mapa</h3>' +
    '<p class="subtle" style="margin-top:0">En cuanto un actor tenga nombre, nivel de influencia e interés, aparece numerado en el mapa — arrástralo a su ubicación aproximada. <span style="color:var(--orange);font-weight:700">P</span> es tu proyecto.</p>' +
    '<div id="mapaActores"></div>' +
    '<h3>Vista previa de tu matriz</h3>' +
    '<div id="previaCuadrante">' + renderCuadranteHtml(actoresValidos()) + '</div>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnSiguiente">Continuar a los reactivos →</button>' +
    '</div>';

  if (mapaActoresLeaflet) { mapaActoresLeaflet.remove(); mapaActoresLeaflet = null; capaMarcadoresActores = null; }
  if (state.ubicacion) {
    mapaActoresLeaflet = L.map('mapaActores').setView([state.ubicacion.lat, state.ubicacion.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(mapaActoresLeaflet);
    L.marker([state.ubicacion.lat, state.ubicacion.lng], { icon: _iconoProyecto(), zIndexOffset: 1000 }).addTo(mapaActoresLeaflet);
    capaMarcadoresActores = L.layerGroup().addTo(mapaActoresLeaflet);
    actualizarMarcadoresActores();
  }

  function actualizarMarcadoresActores() {
    if (!mapaActoresLeaflet || !capaMarcadoresActores || !state.ubicacion) return;
    capaMarcadoresActores.clearLayers();
    actoresValidos().forEach(function (a, i) {
      if (a.lat == null || a.lng == null) {
        var off = _offsetActorLatLng(state.ubicacion.lat, state.ubicacion.lng, i);
        a.lat = off[0]; a.lng = off[1];
      }
      var m = L.marker([a.lat, a.lng], { icon: _iconoNumeroActor(i + 1), draggable: true });
      m.on('dragend', function () { var pos = m.getLatLng(); a.lat = pos.lat; a.lng = pos.lng; });
      m.addTo(capaMarcadoresActores);
    });
  }

  function leerFilaDesdeDom(idx) {
    var fila = app.querySelector('.actor-fila[data-idx="' + idx + '"]');
    if (!fila) return;
    var previo = state.actores[idx] || {};
    state.actores[idx] = {
      nombre: fila.querySelector('.actNombre').value,
      tipo: fila.querySelector('.actTipo').value,
      influencia: fila.querySelector('.actInfluencia').value,
      interes: fila.querySelector('.actInteres').value,
      lat: previo.lat, lng: previo.lng
    };
    var previa = document.getElementById('previaCuadrante');
    if (previa) previa.innerHTML = renderCuadranteHtml(actoresValidos());
    actualizarMarcadoresActores();
  }

  Array.prototype.forEach.call(app.querySelectorAll('.actNombre, .actTipo, .actInfluencia, .actInteres'), function (el) {
    el.addEventListener('input', function () { leerFilaDesdeDom(el.getAttribute('data-idx')); });
    el.addEventListener('change', function () { leerFilaDesdeDom(el.getAttribute('data-idx')); });
  });

  Array.prototype.forEach.call(app.querySelectorAll('.quitar'), function (btn) {
    btn.onclick = function () {
      var idx = Number(btn.getAttribute('data-idx'));
      state.actores.splice(idx, 1);
      renderActores();
    };
  });

  document.getElementById('btnAgregarActor').onclick = function () {
    if (state.actores.length >= 8) return;
    state.actores.push({ nombre: '', tipo: '', influencia: '', interes: '' });
    renderActores();
  };

  document.getElementById('btnAtras').onclick = function () { state.paso = 1; render(); };
  document.getElementById('btnSiguiente').onclick = function () {
    var validos = actoresValidos();
    if (validos.length < 3) {
      document.getElementById('secMsg').innerHTML = '<div class="msg error">Completa nombre, influencia e interés de al menos 3 actores (llevas ' + validos.length + ').</div>';
      return;
    }
    state.paso = 3;
    render();
  };
}

/* ---- PASO 3: diez reactivos, agrupados en 3 dimensiones ---- */
function renderReactivos() {
  var bloquesHtml = DIMENSIONES_TERRITORIO.map(function (dim, di) {
    var itemsHtml = dim.items.map(function (texto, ii) {
      var name = 'd' + di + 'i' + ii;
      var opcionesHtml = OPCIONES_LIKERT_TER.map(function (op) {
        var marcada = state.respuestas[name] === op.puntos;
        return '<button type="button" class="op-choice' + (marcada ? ' marcada' : '') + '" data-name="' + name + '" data-puntos="' + op.puntos + '">' + escapeHtml(op.etiqueta) + '</button>';
      }).join('');
      return '<div class="pregunta-riesgo" data-name="' + name + '">' +
        '<div class="pregunta-texto">' + escapeHtml(texto) + '</div>' +
        '<div class="opciones-riesgo">' + opcionesHtml + '</div>' +
      '</div>';
    }).join('');
    return '<div class="bloque-categoria">' +
      '<div class="num-bloque">Dimensión ' + (di + 1) + ' de ' + DIMENSIONES_TERRITORIO.length + '</div>' +
      '<div class="nombre-categoria">' + escapeHtml(dim.nombre) + '</div>' +
      itemsHtml +
    '</div>';
  }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>Diez preguntas sobre tu mapeo territorial</h2>' +
    '<p class="subtle" style="margin-top:0">Responde con honestidad — no hay respuestas correctas, solo un panorama de dónde estás hoy.</p>' +
    '<div id="secMsg"></div>' +
    bloquesHtml +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnVerResultado">Ver mi resultado</button>' +
    '</div>';

  Array.prototype.forEach.call(app.querySelectorAll('.op-choice'), function (btn) {
    btn.onclick = function () {
      var name = btn.getAttribute('data-name');
      var puntos = Number(btn.getAttribute('data-puntos'));
      state.respuestas[name] = puntos;
      var grupo = app.querySelector('.pregunta-riesgo[data-name="' + name + '"]');
      Array.prototype.forEach.call(grupo.querySelectorAll('.op-choice'), function (b) { b.classList.remove('marcada'); });
      btn.classList.add('marcada');
    };
  });

  document.getElementById('btnAtras').onclick = function () { state.paso = 2; render(); };
  document.getElementById('btnVerResultado').onclick = async function () {
    var totalPreguntas = DIMENSIONES_TERRITORIO.reduce(function (n, c) { return n + c.items.length; }, 0);
    var respondidas = Object.keys(state.respuestas).length;
    if (respondidas < totalPreguntas) {
      document.getElementById('secMsg').innerHTML = '<div class="msg error">Responde las ' + totalPreguntas + ' preguntas antes de continuar (llevas ' + respondidas + ').</div>';
      return;
    }

    var categorias = DIMENSIONES_TERRITORIO.map(function (dim, di) {
      var maxDim = dim.items.length * 3;
      var subtotal = dim.items.reduce(function (s, _t, ii) { return s + (state.respuestas['d' + di + 'i' + ii] || 0); }, 0);
      return { nombre: dim.nombre, clave: dim.clave, subtotal: subtotal, max: maxDim, nivel: _nivelBarraTer(subtotal, maxDim) };
    });
    var puntajeTotal = categorias.reduce(function (s, c) { return s + c.subtotal; }, 0);
    var banda = _bandaTerritorio(puntajeTotal);
    var peor = categorias.slice().sort(function (a, b) { return (a.subtotal / a.max) - (b.subtotal / b.max); })[0];
    var actores = actoresValidos();

    state.resultado = { categorias: categorias, puntajeTotal: puntajeTotal, banda: banda, peor: peor, actores: actores };

    var btn = document.getElementById('btnVerResultado');
    btn.disabled = true; btn.textContent = 'Guardando...';
    var d = state.datos || {};
    var ubicacionTexto = d.municipio + ', ' + d.estado + (d.colonia ? (' — Col. ' + d.colonia) : '') + (d.cp ? (' — CP ' + d.cp) : '');
    var coordTexto = state.ubicacion ? (' — coordenadas aprox. ' + state.ubicacion.lat.toFixed(4) + ', ' + state.ubicacion.lng.toFixed(4)) : '';
    var resumenNotas = 'Mapa territorial: ' + banda.etiqueta + ' (' + puntajeTotal + '/30). ' +
      'Mayor oportunidad: ' + peor.nombre + ' (' + peor.subtotal + '/' + peor.max + '). ' +
      'Territorio: ' + ubicacionTexto + coordTexto + '. ' +
      'Actores cargados (' + actores.length + '): ' + resumenActoresTexto(actores) + '. ' +
      categorias.map(function (c) { return c.nombre + ': ' + c.subtotal + '/' + c.max; }).join(' — ');
    await jsonp('capturarClienteDiagnostico', {
      organizacion: d.organizacion,
      categoria: d.categoria,
      ejeInteres: 'Comunidad',
      nombreContacto: d.nombre,
      cargo: d.cargo,
      correo: d.email,
      telefono: d.telefono,
      leadMagnet: 'Mapa territorial (Territorio)',
      consentimiento: 'Sí',
      notas: resumenNotas,
      respuestasCompletas: JSON.stringify({ respuestas: state.respuestas, actores: state.actores, ubicacion: state.ubicacion }),
      sitioWebTrampa: d.sitioWebTrampa
    });
    // El resultado se muestra siempre, incluso si el guardado del lead
    // falla por algún motivo de red.
    state.paso = 4;
    render();
  };
}

// Interpretación instantánea basada en reglas (sin IA) — mismo patrón que
// diagnostico.html, muestra_se.html, muestra_candidato.html y muestra_imes*.
// Combina banda, dimensión con mayor oportunidad, matriz de actores propia y
// el territorio que la persona ya escribió, con fundamento académico. La
// interpretación con IA llega después, solo por correo.
function _pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
var CITAS_TER = {
  freeman: 'Freeman, R. E. (1984). Strategic management: a stakeholder approach. Pitman.',
  ostrom: 'Ostrom, E. (1990). Governing the commons: the evolution of institutions for collective action. Cambridge University Press.',
  mitchell: 'Mitchell, R. K., Agle, B. R. y Wood, D. J. (1997). Toward a theory of stakeholder identification and salience: defining the principle of who and what really counts. Academy of Management Review, 22(4), 853–886.',
  boisier: 'Boisier, S. (1999). Desarrollo (local): ¿de qué estamos hablando? En G. Madoery y A. Vázquez Barquero (Eds.), Transformaciones globales, instituciones y políticas de desarrollo local. Homo Sapiens.',
  putnam: 'Putnam, R. D. (1993). Making democracy work: civic traditions in modern Italy. Princeton University Press.'
};
var LECTURA_DIMENSION_TER = {
  'Identificación de actores y recursos': { clave: 'mitchell', texto: 'Mitchell, Agle y Wood (1997) plantean que la importancia real de un actor para un proyecto depende de tres atributos — poder, legitimidad y urgencia — no solo de cuánto trato tengas con él. La matriz de poder-interés que armaste arriba es una primera aproximación práctica a esa idea: te ayuda a priorizar a quién gestionar de cerca antes de que un actor de alto poder se vuelva un obstáculo inesperado.' },
  'Información y diagnóstico territorial': { clave: 'boisier', texto: 'Boisier (1999) insiste en que el desarrollo territorial no ocurre en abstracto: depende del conocimiento acumulado sobre las condiciones concretas de cada territorio — su historia, su cultura, sus tensiones propias. Sin ese diagnóstico, hasta el proyecto mejor diseñado corre el riesgo de chocar con una realidad local que no anticipó.' },
  'Uso estratégico del mapeo': { clave: 'putnam', texto: 'Putnam (1993) documentó que el llamado capital social — las redes de relaciones que un equipo u organización logra activar — predice el éxito de una intervención tanto o más que los recursos económicos disponibles. Que todo tu equipo, no solo una persona, use la información territorial recabada es lo que convierte un mapeo en capital social real.' }
};
function interpretacionReglasTerritorio(d, r) {
  var citas = {}; function usar(c) { citas[c] = true; }
  var t = '';
  var aperturas = [
    { clave: 'freeman', texto: 'Freeman (1984) transformó la manera de planear proyectos al proponer que ningún actor con capacidad de afectar o ser afectado por un proyecto —autoridades, comunidad, aliados, competidores— puede tratarse como un dato secundario: cada uno merece un lugar explícito en la planeación. Este resultado es una primera fotografía de qué tan bien tienes mapeado ese entorno.' },
    { clave: 'ostrom', texto: 'Ostrom (1990) mostró que la gestión efectiva de recursos compartidos por varios actores depende de reglas claras y de conocer bien a quienes participan, no solo de la buena voluntad general. Cartografiar tu territorio y tus actores clave, como hiciste aquí, es el primer paso hacia esa gestión efectiva.' }
  ];
  var apertura = _pick(aperturas); usar(apertura.clave);
  t += apertura.texto + '\n\n';
  var numActores = r.actores.length;
  var ubicacionTexto = d.municipio ? (d.municipio + ', ' + d.estado) : 'tu territorio';
  t += 'Tu proyecto en ' + ubicacionTexto + ' obtuvo ' + r.puntajeTotal + ' de 30 puntos (' + r.banda.etiqueta.toLowerCase() + '), con ' + numActores + ' actor' + (numActores === 1 ? '' : 'es') + ' clave ya cargado' + (numActores === 1 ? '' : 's') + ' en tu matriz. De las tres dimensiones evaluadas, ' + r.peor.nombre + ' es la que más te conviene fortalecer primero (' + r.peor.subtotal + ' de ' + r.peor.max + ' puntos).\n\n';
  var lectura = LECTURA_DIMENSION_TER[r.peor.nombre];
  if (lectura) { usar(lectura.clave); t += lectura.texto + '\n\n'; }
  t += 'Esta muestra evalúa 10 reactivos en 3 dimensiones; el instrumento completo (INS-TER-01, Mapa de actores y recursos, y el resto del eje Territorio de la Plataforma Sintropía) profundiza mucho más en cada una, acompañado por el equipo de Sintropía Social.\n\n';
  t += 'Referencias (APA 7ª edición):\n';
  Object.keys(citas).sort().forEach(function (c) { if (CITAS_TER[c]) t += CITAS_TER[c] + '\n'; });
  return t;
}

/* ---- PASO 4: resultado — banda + barras + recap de mapa y actores + interpretación + PDF + CTA ---- */
var mapaRecapLeaflet = null;

function renderResultado() {
  var r = state.resultado, d = state.datos || {};
  var rec = RECOMENDACION_BANDA_TER[r.banda.clave];
  if (!state.interpretacionReglas) state.interpretacionReglas = interpretacionReglasTerritorio(d, r);
  var interpretacionHtml = (state.interpretacionReglas || '').split('\n\n').filter(function (p) { return p.trim(); })
    .map(function (p) { return '<p style="margin:0 0 10px">' + escapeHtml(p).replace(/\n/g, '<br>') + '</p>'; }).join('');

  var categoriasHtml = r.categorias.map(function (c) {
    var pct = Math.round((c.subtotal / c.max) * 100);
    return '<div class="categoria-resultado">' +
      '<div class="nombre">' + escapeHtml(c.nombre) + '</div>' +
      '<div class="barra-riesgo"><div class="relleno ' + c.nivel + '" style="width:' + pct + '%"></div></div>' +
      '<p class="subtle" style="margin:0">' + c.subtotal + ' de ' + c.max + ' puntos</p>' +
    '</div>';
  }).join('');

  var ubicacionTexto = d.municipio + ', ' + d.estado + (d.colonia ? (' — Col. ' + d.colonia) : '') + (d.cp ? (' — CP ' + d.cp) : '');

  app.innerHTML =
    progresoHtml() +
    '<div class="banda-box">' +
      '<span class="banda-luz ' + r.banda.claseCss + '"></span>' +
      '<span class="banda-etiqueta ' + r.banda.claseCss + '">' + r.banda.etiqueta + '</span>' +
      '<p class="banda-puntaje">' + r.puntajeTotal + ' de 30 puntos · tu mayor oportunidad: ' + escapeHtml(r.peor.nombre) + '</p>' +
    '</div>' +
    categoriasHtml +
    '<h3>Tu territorio</h3>' +
    '<p class="subtle" style="margin-top:0">' + escapeHtml(ubicacionTexto) + '</p>' +
    '<div id="mapaRecap"></div>' +
    '<h3>Tu matriz de actores</h3>' +
    renderCuadranteHtml(r.actores) +
    '<div class="categoria-resultado" style="border-color:var(--purple)">' +
      '<div class="nombre" style="color:var(--purple-dark)">Interpretación de tu resultado</div>' +
      '<div style="margin-top:8px">' + interpretacionHtml + '</div>' +
    '</div>' +
    '<p class="subtle" style="margin:4px 0 0">A la brevedad te llegará a tu correo una interpretación más completa (una cuartilla, con referencias académicas) y recomendaciones concretas para tu proyecto. Si quieres que te ayudemos desde Sintropía a fortalecer tu mapeo territorial, escríbenos.</p>' +
    '<div id="correoAviso"></div>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnDescargarPdf">Descargar mi mapa territorial en PDF</button>' +
    '</div>' +
    '<div class="cta">' +
      '<h2>' + escapeHtml(rec.titulo) + '</h2>' +
      '<p>' + escapeHtml(rec.texto) + '</p>' +
      '<div class="fila-botones">' +
        '<a class="boton-cta solido" href="https://calendly.com/sintropiassociales/30min" target="_blank" rel="noopener">' + escapeHtml(rec.ctaSolido) + '</a>' +
        '<a class="boton-cta contorno" href="mailto:comunicacion@sintropiasocial.com">' + escapeHtml(rec.ctaContorno) + '</a>' +
      '</div>' +
    '</div>';

  if (mapaRecapLeaflet) { mapaRecapLeaflet.remove(); mapaRecapLeaflet = null; }
  var centroRecap = state.ubicacion ? [state.ubicacion.lat, state.ubicacion.lng] : CENTRO_MEXICO;
  mapaRecapLeaflet = L.map('mapaRecap', { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView(centroRecap, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(mapaRecapLeaflet);
  L.marker(centroRecap, { icon: _iconoProyecto(), zIndexOffset: 1000 }).addTo(mapaRecapLeaflet);
  var puntosRecap = [centroRecap];
  r.actores.forEach(function (a, i) {
    if (a.lat != null && a.lng != null) {
      L.marker([a.lat, a.lng], { icon: _iconoNumeroActor(i + 1) }).addTo(mapaRecapLeaflet);
      puntosRecap.push([a.lat, a.lng]);
    }
  });
  if (puntosRecap.length > 1) mapaRecapLeaflet.fitBounds(puntosRecap, { padding: [26, 26] });

  document.getElementById('btnDescargarPdf').onclick = function () { descargarTerritorioPdf(); };
  // El correo se encola de inmediato (no espera a _iniciarCadenaIACorreo) —
  // ver el porqué en el comentario de _enviarResultadoMuestraCorreo.
  _enviarResultadoMuestraCorreo();
  _iniciarCadenaIACorreo();
  _cargarMapaTerritorioPng();
}

/* ---- Imagen real de mapa para el PDF: se pide al servidor en cuanto se
 * muestra el resultado (para que ya esté lista cuando la persona dé clic
 * en "Descargar PDF"). Si falla o tarda, el PDF usa como respaldo el
 * diagrama esquemático dibujado en el propio navegador. ---- */
function _cargarMapaTerritorioPng() {
  if (!state.ubicacion || state.mapaPngBase64) return;
  var d = state.datos || {}, r = state.resultado;
  var actoresConGeo = r.actores.filter(function (a) { return a.lat != null && a.lng != null; })
    .map(function (a) { return { lat: a.lat, lng: a.lng }; });
  jsonp('obtenerMapaTerritorioPng', {
    lat: state.ubicacion.lat,
    lng: state.ubicacion.lng,
    actores: JSON.stringify(actoresConGeo),
    email: d.email,
    sitioWebTrampa: d.sitioWebTrampa
  }).then(function (resp) {
    if (resp && resp.ok && resp.imagenBase64) state.mapaPngBase64 = resp.imagenBase64;
    // Si falla, no pasa nada — descargarTerritorioPdf() usa el diagrama
    // esquemático como respaldo automáticamente.
  });
}

// Arma los parámetros para generarInterpretacionMuestra — se usan en DOS
// lugares: en _iniciarCadenaIACorreo (para el PDF descargable del lado del
// cliente, si la IA alcanza a responder antes de que la persona lo pida) y
// dentro de _enviarResultadoMuestraCorreo (para que el procesador en
// segundo plano genere su propia ampliación con IA del lado del servidor).
function _paramsInterpretacionIA() {
  var d = state.datos || {}, r = state.resultado;
  return {
    muestra: 'Territorio',
    nombre: d.nombre,
    email: d.email,
    resultados: JSON.stringify(r.categorias.map(function (c) {
      return { nombre: c.nombre, puntaje: c.subtotal, max: c.max };
    })),
    banda: r.banda.etiqueta,
    puntajeTotal: r.puntajeTotal,
    peorDimension: r.peor.nombre,
    resumenActores: resumenActoresTexto(r.actores),
    ubicacion: d.municipio + ', ' + d.estado,
    sitioWebTrampa: d.sitioWebTrampa
  };
}

/* ---- Interpretación ampliada con IA — SOLO para el PDF descargable del
 * lado del cliente (ver descargarTerritorioPdf, más abajo, que usa
 * state.interpretacionIA si ya llegó). Ya NO dispara el correo. ---- */
function _iniciarCadenaIACorreo() {
  jsonp('generarInterpretacionMuestra', _paramsInterpretacionIA(), TIMEOUT_CORREO_IA_MS).then(function (resp) {
    if (resp && resp.ok && resp.interpretacion) state.interpretacionIA = resp.interpretacion;
  });
}

/* ---- Correo automático con el resultado (PDF adjunto + oferta con IA) ----
 * Se dispara de inmediato al ver el resultado — antes esperaba a la IA de
 * _iniciarCadenaIACorreo, pero eso significaba que si la persona cerraba
 * la ventana antes de esa respuesta, el correo nunca se llegaba a encolar.
 * Se manda paramsInterpretacionIA (no un texto ya generado) para que el
 * procesador en segundo plano genere su propia interpretación con IA en
 * el servidor — el correo sale completo sin importar qué haga la persona
 * después de ver su resultado. */
function _enviarResultadoMuestraCorreo() {
  if (state.correoResultadoEnviado) return;
  state.correoResultadoEnviado = true;
  var d = state.datos || {}, r = state.resultado;
  var secciones = [
    { titulo: 'Interpretación de tu resultado', parrafos: (state.interpretacionReglas || '').split('\n\n').filter(function (p) { return p.trim(); }) }
  ].concat(r.categorias.map(function (c) {
    return { titulo: c.nombre, parrafos: [c.subtotal + ' de ' + c.max + ' puntos.'] };
  }));
  secciones.push({
    titulo: 'Matriz de actores clave',
    parrafos: r.actores.map(function (a) {
      return a.nombre + ' — ' + (a.tipo || 'sin tipo') + ' — influencia ' + a.influencia + ', interés ' + a.interes + ' — ' + _estrategiaCuadrante(a.influencia, a.interes) + '.';
    })
  });
  var resumenTexto = 'Mapa territorial: ' + r.banda.etiqueta + ' (' + r.puntajeTotal + '/30). ' +
    'Mayor oportunidad: ' + r.peor.nombre + ' (' + r.peor.subtotal + '/' + r.peor.max + '). ' +
    'Territorio: ' + d.municipio + ', ' + d.estado + '.';
  jsonpPost('enviarResultadoMuestra', {
    tipoMuestra: 'Territorio',
    nombre: d.nombre,
    correo: d.email,
    organizacion: d.organizacion,
    tituloResultado: 'Mapa territorial de tu proyecto',
    resumenTexto: resumenTexto,
    secciones: JSON.stringify(secciones),
    paramsInterpretacionIA: JSON.stringify(_paramsInterpretacionIA()),
    sitioWebTrampa: d.sitioWebTrampa
  }, TIMEOUT_CORREO_IA_MS).then(function (resp) {
    var aviso = document.getElementById('correoAviso');
    if (!aviso) return;
    if (resp && resp.ok) {
      aviso.innerHTML = '<div class="mapa-ficha">Te enviamos una interpretación más completa de este resultado a <b>' + escapeHtml(d.email) + '</b>.</div>';
    } else {
      aviso.innerHTML = '<div class="msg error">No pudimos enviarte el correo con tu resultado' +
        (resp && resp.error ? (': ' + escapeHtml(resp.error)) : ' — intenta de nuevo más tarde') +
        '. Mientras tanto puedes descargarlo en PDF aquí abajo.</div>';
    }
  });
}

/* ---- Diagrama esquemático de ubicación para el PDF: dibuja un recuadro
 * con el proyecto (P) al centro y los actores alrededor, en la dirección
 * y proximidad relativa real (a partir de sus lat/lng), pero sin escala
 * de mapa ni calles — así no depende de poder descargar tiles de mapa
 * dentro del PDF generado en el navegador. ---- */
function _dibujarMapaEsquematicoPdf(doc, x, y, ancho, alto, r, purple) {
  doc.setFillColor(250, 248, 255);
  doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
  doc.roundedRect(x, y, ancho, alto, 8, 8, 'FD');

  var cx = x + ancho / 2, cy = y + alto / 2;
  var radioMax = Math.min(ancho, alto) / 2 - 28;
  var actoresConGeo = (r.actores || []).filter(function (a) { return a.lat != null && a.lng != null; });

  var deltaMax = 0.0006;
  actoresConGeo.forEach(function (a) {
    var dLat = a.lat - state.ubicacion.lat;
    var dLng = (a.lng - state.ubicacion.lng) * Math.cos(state.ubicacion.lat * Math.PI / 180);
    var dist = Math.sqrt(dLat * dLat + dLng * dLng);
    if (dist > deltaMax) deltaMax = dist;
  });

  doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
  doc.setTextColor(150, 145, 165);
  doc.text('N', x + 18, y + 20, { align: 'center' });
  doc.setFillColor(150, 145, 165);
  doc.triangle(x + 18, y + 10, x + 14, y + 16, x + 22, y + 16, 'F');

  actoresConGeo.forEach(function (a, i) {
    var dLat = a.lat - state.ubicacion.lat;
    var dLng = (a.lng - state.ubicacion.lng) * Math.cos(state.ubicacion.lat * Math.PI / 180);
    var px = cx + (dLng / deltaMax) * radioMax;
    var py = cy - (dLat / deltaMax) * radioMax;
    doc.setFillColor(purple[0], purple[1], purple[2]);
    doc.circle(px, py, 7.5, 'F');
    doc.setDrawColor(255, 255, 255); doc.setLineWidth(1.3);
    doc.circle(px, py, 7.5, 'S');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
    doc.text(String(i + 1), px, py + 2.8, { align: 'center' });
  });

  doc.setFillColor(255, 121, 41);
  doc.circle(cx, cy, 9, 'F');
  doc.setDrawColor(255, 255, 255); doc.setLineWidth(1.5);
  doc.circle(cx, cy, 9, 'S');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
  doc.text('P', cx, cy + 3, { align: 'center' });

  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
  doc.setTextColor(140, 135, 155);
  doc.text('Diagrama esquemático (no a escala) — P = tu proyecto · los números corresponden a la matriz de actores.', x, y + alto + 12);
}

/* ---- Mapa real (imagen generada en el servidor, ver
 * _cargarMapaTerritorioPng) para el PDF: proyecto (P) y actores
 * numerados, ya marcados sobre el mapa real por el propio servicio de
 * Maps — no requiere capturar tiles desde el navegador. Si por lo que
 * sea la imagen no se pudo dibujar, cae de vuelta al diagrama
 * esquemático. ---- */
function _dibujarMapaImagenPdf(doc, x, y, ancho, alto, r, purple) {
  doc.setFillColor(250, 248, 255);
  doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
  doc.roundedRect(x, y, ancho, alto, 8, 8, 'FD');
  try {
    var imgW = 640, imgH = 420;
    var margenInterno = 8;
    var escala = Math.min((ancho - margenInterno * 2) / imgW, (alto - margenInterno * 2) / imgH);
    var wFinal = imgW * escala, hFinal = imgH * escala;
    var xImg = x + (ancho - wFinal) / 2, yImg = y + (alto - hFinal) / 2;
    doc.addImage(state.mapaPngBase64, 'PNG', xImg, yImg, wFinal, hFinal);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
    doc.setTextColor(140, 135, 155);
    doc.text('P = tu proyecto · los números corresponden a la matriz de actores. Mapa: Google Maps.', x, y + alto + 12);
  } catch (eImg) {
    _dibujarMapaEsquematicoPdf(doc, x, y, ancho, alto, r, purple);
  }
}

/* ---- Descargable en PDF ---- */
function descargarTerritorioPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.');
    return;
  }
  var r = state.resultado, d = state.datos || {};
  var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  var purple = [99, 30, 235];
  var coloresBanda = { verde: [30, 132, 73], amarillo: [154, 123, 10], rojo: [192, 57, 43] };
  var margenIzq = 40, anchoTexto = 532, y;

  doc.setFillColor(purple[0], purple[1], purple[2]);
  doc.rect(0, 0, 612, 70, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('Sintropía Social — Mapa territorial', margenIzq, 42);

  y = 100;
  doc.setTextColor(30, 30, 30);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(d.organizacion || 'Tu organización', margenIzq, y);
  y += 18;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.setTextColor(80, 80, 90);
  var ubicacionPdf = d.municipio + ', ' + d.estado + (d.colonia ? (' — Col. ' + d.colonia) : '') + (d.cp ? (' — CP ' + d.cp) : '');
  doc.text(ubicacionPdf, margenIzq, y);
  y += 22;

  var col = coloresBanda[r.banda.clave];
  doc.setFillColor(col[0], col[1], col[2]);
  doc.circle(margenIzq + 7, y - 5, 6, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.setTextColor(col[0], col[1], col[2]);
  doc.text(r.banda.etiqueta.toUpperCase() + '   ·   ' + r.puntajeTotal + ' de 30 puntos', margenIzq + 20, y);
  y += 26;

  // Mapa de ubicación: si ya llegó la imagen real generada en el
  // servidor (ver _cargarMapaTerritorioPng, pedida al mostrar el
  // resultado), se usa esa; si no está lista o falló, se usa un diagrama
  // esquemático de posiciones relativas como respaldo — para que el PDF
  // nunca se quede sin mapa.
  if (state.ubicacion) {
    var altoMapaPdf = 190;
    if (y + altoMapaPdf + 34 > 730) { doc.addPage(); y = 60; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(purple[0], purple[1], purple[2]);
    doc.text('Mapa de ubicación', margenIzq, y);
    y += 12;
    if (state.mapaPngBase64) {
      _dibujarMapaImagenPdf(doc, margenIzq, y, anchoTexto, altoMapaPdf, r, purple);
    } else {
      _dibujarMapaEsquematicoPdf(doc, margenIzq, y, anchoTexto, altoMapaPdf, r, purple);
    }
    y += altoMapaPdf + 26;
  }

  r.categorias.forEach(function (c) {
    doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
    doc.line(margenIzq, y, margenIzq + anchoTexto, y);
    y += 16;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(30, 30, 30);
    doc.text(c.nombre + '  —  ' + c.subtotal + '/' + c.max, margenIzq, y);
    y += 18;
  });

  // Matriz de actores
  y += 4;
  doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 18;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.setTextColor(purple[0], purple[1], purple[2]);
  doc.text('Matriz de actores clave', margenIzq, y);
  y += 16;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.setTextColor(60, 60, 60);
  r.actores.forEach(function (a) {
    if (y > 700) { doc.addPage(); y = 60; }
    var linea = '• ' + a.nombre + ' — ' + (a.tipo || 'sin tipo') + ' — influencia ' + a.influencia + ', interés ' + a.interes + ' — ' + _estrategiaCuadrante(a.influencia, a.interes) + '.';
    var lineas = doc.splitTextToSize(linea, anchoTexto);
    doc.text(lineas, margenIzq, y);
    y += lineas.length * 12 + 4;
  });

  if (state.interpretacionIA) {
    if (y > 650) { doc.addPage(); y = 60; }
    y += 6;
    doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
    y += 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(purple[0], purple[1], purple[2]);
    doc.text('Interpretación', margenIzq, y);
    y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.setTextColor(60, 60, 60);
    var lineasIa = doc.splitTextToSize(state.interpretacionIA, anchoTexto);
    doc.text(lineasIa, margenIzq, y);
    y += lineasIa.length * 13 + 6;
  }

  if (y > 650) { doc.addPage(); y = 60; }
  var rec = RECOMENDACION_BANDA_TER[r.banda.clave];
  y += 8;
  doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.setTextColor(purple[0], purple[1], purple[2]);
  var lineasTituloRec = doc.splitTextToSize(rec.titulo, anchoTexto);
  doc.text(lineasTituloRec, margenIzq, y);
  y += lineasTituloRec.length * 14 + 4;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.setTextColor(80, 80, 90);
  var lineasTextoRec = doc.splitTextToSize(rec.texto, anchoTexto);
  doc.text(lineasTextoRec, margenIzq, y);
  y += lineasTextoRec.length * 13 + 10;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.setTextColor(99, 30, 235);
  var etiquetaCita = 'Haz tu cita aquí';
  doc.textWithLink(etiquetaCita, margenIzq, y, { url: 'https://calendly.com/sintropiassociales/30min' });
  var anchoCita = doc.getTextWidth(etiquetaCita);
  doc.setDrawColor(99, 30, 235); doc.setLineWidth(0.4);
  doc.line(margenIzq, y + 1.5, margenIzq + anchoCita, y + 1.5);
  doc.setTextColor(107, 107, 120);
  doc.text(' o escríbenos a comunicacion@sintropiasocial.com.', margenIzq + anchoCita, y);
  y += 30;

  if (y > 730) { doc.addPage(); y = 60; }
  doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 22;
  var centroX = margenIzq + anchoTexto / 2;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.setTextColor(purple[0], purple[1], purple[2]);
  doc.text('Sintropía Social', centroX, y, { align: 'center' });
  y += 16;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.setTextColor(107, 107, 120);
  doc.text('sintropiassociales-del.github.io  ·  comunicacion@sintropiasocial.com', centroX, y, { align: 'center' });

  doc.save('mapa-territorial-sintropia.pdf');
}

render();
