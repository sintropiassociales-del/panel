<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pulso de Mercado — Sintropía Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --purple: #631EEB;
    --purple-dark: #4E17B8;
    --orange: #FF7929;
    --bg: #F5F3FC;
    --card: #FFFFFF;
    --text: #2C2C2C;
    --subtle: #6B6B78;
    --border: #E6E2F5;
    --error: #C0392B;
    --error-bg: #FDECEA;
    --verde: #1E8449; --verde-bg: #EAF7EE; --verde-luz: #22C55E;
    --amarillo: #B7770A; --amarillo-bg: #FEF6E0; --amarillo-luz: #FBBF24;
    --rojo: #C0392B; --rojo-bg: #FDECEA; --rojo-luz: #E63946;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Open Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
  }
  header.top {
    background: var(--purple); color: #fff; padding: 26px 18px 44px; text-align: center;
    border-radius: 0 0 22px 22px;
  }
  header.top .marca { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  header.top .marca span { color: var(--orange); }
  header.top .subt { font-size: 13.5px; opacity: .92; margin-top: 6px; max-width: 440px; margin-left: auto; margin-right: auto; }
  main { max-width: 660px; margin: -26px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 26px 24px; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(99,30,235,.08); border: 1px solid var(--border);
  }
  h1 { font-size: 21px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 4px; color: var(--purple-dark); }
  h3 { font-size: 15px; margin: 22px 0 2px; color: var(--purple-dark); }
  p.subtle, .subtle { color: var(--subtle); font-size: 13.5px; }
  .progreso { display: flex; gap: 6px; margin: 18px 0 22px; }
  .progreso .paso { flex: 1; height: 6px; border-radius: 4px; background: var(--border); }
  .progreso .paso.hecho { background: var(--orange); }
  .progreso .paso.actual { background: var(--purple); }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 5px; }
  label .req { color: var(--orange); }
  label .opc { color: var(--subtle); font-weight: 400; }
  input[type=text], input[type=email], select, textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  .fila-botones { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px;
    padding: 12px 24px; border: none; cursor: pointer;
  }
  button.primary { background: var(--purple); color: #fff; }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { padding: 10px 13px; border-radius: 9px; font-size: 13.5px; margin: 12px 0; }
  .msg.error { background: var(--error-bg); color: var(--error); }

  /* Consentimiento + honeypot */
  .consentimiento { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; background: #FAF8FF;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .consentimiento input { margin-top: 3px; width: auto; }
  .consentimiento label { margin: 0; font-weight: 400; font-size: 13px; }
  .campo-trampa { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; overflow: hidden; }

  /* Marco / explicación teórica (componente histórico) */
  .marco-teorico { background: #FAF8FF; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    font-size: 13px; color: var(--text); margin: 4px 0 18px; }
  .marco-teorico b { color: var(--purple-dark); }

  /* Mapa de impacto */
  #mapaImpacto, #mapaImpactoRecap { width: 100%; height: 300px; border-radius: 12px; border: 1.5px solid var(--border); }
  #mapaImpactoRecap { height: 240px; }
  .mapa-ficha { background: #FAF8FF; border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px;
    font-size: 13px; color: var(--subtle); margin-top: 10px; }
  .mapa-ficha b { color: var(--text); }
  .escala-intensidad { display: flex; gap: 8px; margin-top: 6px; }
  .escala-intensidad button {
    flex: 1; padding: 10px 4px; font-size: 13px; border: 1.5px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--subtle); font-weight: 700;
  }
  .escala-intensidad button.marcada.actual { background: var(--purple); border-color: var(--purple); color: #fff; }
  .escala-intensidad button.marcada.deseado { background: var(--orange); border-color: var(--orange); color: #fff; }
  .leyenda-circulos { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; font-weight: 600; }
  .leyenda-circulos span { display: inline-flex; align-items: center; gap: 7px; }
  .leyenda-punto { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .leyenda-punto.actual { background: rgba(99,30,235,.55); border: 1.5px solid var(--purple); }
  .leyenda-punto.deseado { background: rgba(255,121,41,.35); border: 1.5px solid var(--orange); }
  .fila-lugar { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .fila-lugar select, .fila-lugar input { flex: 1; min-width: 140px; margin: 0; }

  /* Preguntas por categoría */
  .bloque-categoria { margin-bottom: 26px; }
  .bloque-categoria .num-bloque { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
    color: var(--purple); text-transform: uppercase; margin-bottom: 2px; }
  .bloque-categoria .nombre-categoria { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
  .pregunta-riesgo { border-top: 1px solid var(--border); padding: 16px 0; }
  .pregunta-riesgo:first-of-type { border-top: none; padding-top: 4px; }
  .pregunta-texto { font-size: 14.5px; font-weight: 600; margin-bottom: 10px; }
  .opciones-riesgo { display: flex; gap: 8px; flex-wrap: wrap; }
  .op-choice, .op-negocio {
    flex: 1; min-width: 96px; border: 1.5px solid var(--border); border-radius: 9px; background: #fff;
    color: var(--subtle); font-weight: 600; font-size: 13px; padding: 10px 8px; cursor: pointer; text-align: center;
    transition: background .12s, border-color .12s, color .12s;
  }
  .op-negocio { min-width: 160px; }
  .op-choice.marcada, .op-negocio.marcada { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* Resultado / semáforo */
  .semaforo-box { text-align: center; padding: 8px 4px 4px; }
  .semaforo-luz {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin-right: 8px; vertical-align: middle;
  }
  .semaforo-luz.verde { background: var(--verde-luz); }
  .semaforo-luz.amarillo { background: var(--amarillo-luz); }
  .semaforo-luz.rojo { background: var(--rojo-luz); }
  .semaforo-etiqueta {
    display: inline-block; font-size: 15px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase;
    vertical-align: middle;
  }
  .semaforo-etiqueta.verde { color: var(--verde); }
  .semaforo-etiqueta.amarillo { color: var(--amarillo); }
  .semaforo-etiqueta.rojo { color: var(--rojo); }
  .semaforo-puntaje { font-size: 13px; color: var(--subtle); margin: 6px 0 0; }

  .categoria-resultado { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .categoria-resultado .nombre { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .barra-riesgo { height: 8px; border-radius: 5px; background: var(--border); overflow: hidden; margin-bottom: 4px; }
  .barra-riesgo .relleno { height: 100%; border-radius: 5px; }
  .barra-riesgo .relleno.baja { background: var(--verde-luz); }
  .barra-riesgo .relleno.media { background: var(--amarillo-luz); }
  .barra-riesgo .relleno.alta { background: var(--rojo-luz); }

  .cta { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff; border-radius: 14px;
    padding: 22px 24px; margin-top: 8px; }
  .cta h2 { color: #fff; }
  .cta p { font-size: 13.5px; opacity: .95; }
  .cta a { color: #fff; font-weight: 700; }
  .cta .fila-botones a.boton-cta {
    display: inline-block; text-decoration: none; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 14px;
  }
  .cta .boton-cta.solido { background: #fff; color: var(--purple-dark); }
  .cta .boton-cta.contorno { border: 1.5px solid rgba(255,255,255,.7); color: #fff; }

  footer.pie { text-align: center; font-size: 12px; color: var(--subtle); padding: 10px 16px 34px; }
  footer.pie .wordmark { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  footer.pie a { color: var(--purple); text-decoration: none; }
</style>
</head>

<header class="top">
  <div class="marca">Sintropía <span>Social</span></div>

<main>
  <div id="app" class="card">
    <p class="subtle">Cargando...</p>

<footer class="pie">
  <div class="wordmark"><span style="color:var(--purple)">Sintropía</span> <span style="color:var(--orange)">Social</span></div>
  <a href="https://sintropiassociales-del.github.io/">Sintropía Social</a> · <a href="mailto:comunicacion@sintropiasocial.com">comunicacion@sintropiasocial.com</a>
</footer>

<script>
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZbLiOP7QXvrgUIDhhVciVGY-Yval3YBvqBHOpQfK8El2wHXNNBtZvsnkbwMaJUss/exec';

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// timeoutMs es opcional (default 25s) — la cadena de IA + correo que se
// dispara en segundo plano después de mostrar el resultado usa un margen
// mucho más largo (ver TIMEOUT_CORREO_IA_MS abajo), porque ya no bloquea
// nada en pantalla: no importa si tarda varios minutos en resolverse.
function jsonp(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' }); };
    setTimeout(function () { if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); } }, timeoutMs || 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}
// Variante de jsonp() que manda los parámetros por POST (cuerpo de la
// solicitud) en vez de la URL — jsonp()/GET tiene un límite práctico de
// unos cuantos KB en la URL, y "secciones"/"resumenTexto" del correo de
// resultado pueden superarlo fácilmente. Content-Type text/plain evita que
// el navegador dispare una verificación (preflight) que Apps Script no
// sabe responder — mismo patrón que ya usa el panel de administración
// para subir fotos/adjuntos (ver _subirFotoInstrumento en index.html).
function jsonpPost(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' });
    }, timeoutMs || 25000);
    var body = { action: action };
    params = params || {};
    for (var k in params) { if (params[k] !== undefined && params[k] !== null) body[k] = params[k]; }
    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (resp) { return resp.json(); }).then(function (data) {
      if (timedOut) return;
      clearTimeout(timer);
      resolve(data);
    }).catch(function () {
      if (timedOut) return;
      clearTimeout(timer);
      resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' });
    });
  });
}
var TIMEOUT_CORREO_IA_MS = 240000; // 4 min — la cadena interpretación IA + PDF + correo va en segundo plano

/* ============================================================
 * Catálogo del pulso — 5 categorías × 4 preguntas = 20. Dos tipos:
 *  - "practica": qué tan bien conoces hoy a tu mercado en ese rubro.
 *    Responder "Sí, con certeza" = 0 puntos de vacío; "No" = 2 (hueco).
 *  - "exposicion": qué tan expuesto está el negocio a un vacío de
 *    conocimiento de mercado. Responder "Sí" = 2 puntos (mayor exposición).
 * Con 20 preguntas × máx. 2 puntos = 40 puntos posibles.
 * ============================================================ */
var OPCIONES_PRACTICA = [
  { etiqueta: 'Sí, con certeza', puntos: 0 },
  { etiqueta: 'Parcialmente / no estoy seguro', puntos: 1 },
  { etiqueta: 'No', puntos: 2 }
];
var OPCIONES_EXPOSICION = [
  { etiqueta: 'No', puntos: 0 },
  { etiqueta: 'Parcialmente', puntos: 1 },
  { etiqueta: 'Sí', puntos: 2 }
];

var CATEGORIAS_RIESGO = [
  {
    clave: 'clientes', nombre: 'Conocimiento del cliente', tipo: 'practica',
    items: [
      '¿Tienes perfiles claros y actualizados de tus clientes o segmentos principales (no solo datos demográficos, sino cómo deciden comprar)?',
      '¿Sabes qué problema real resuelve tu producto o servicio para cada segmento, en las propias palabras de tus clientes?',
      '¿Has hablado directamente con clientes (entrevista o encuesta) en los últimos 6 meses?',
      '¿Sabes por qué un cliente típico te elige a ti y no a otra opción?'
    ]
  },
  {
    clave: 'competencia', nombre: 'Conocimiento de la competencia', tipo: 'practica',
    items: [
      '¿Tienes un mapeo actualizado de tus competidores directos e indirectos?',
      '¿Sabes qué precios y condiciones ofrece tu competencia hoy?',
      '¿Monitoreas cambios relevantes de tu competencia (nuevos productos, campañas, movimientos de precio)?',
      '¿Sabes en qué te diferencias realmente de tu competencia, más allá de "mejor calidad o servicio"?'
    ]
  },
  {
    clave: 'tendencias', nombre: 'Tendencias y contexto del mercado', tipo: 'practica',
    items: [
      '¿Sigues indicadores o tendencias de tu sector que puedan afectar tu demanda?',
      '¿Sabes qué está cambiando en el comportamiento de compra de tus clientes?',
      '¿Tienes claro qué tan grande es tu mercado potencial real, no solo tu cartera actual?',
      '¿Revisas periódicamente si hay nuevos segmentos o nichos que podrías atender?'
    ]
  },
  {
    clave: 'datos', nombre: 'Uso de datos para decidir', tipo: 'practica',
    items: [
      '¿Tus decisiones de precio, producto o promoción se basan en datos de mercado, más que en intuición?',
      '¿Tienes un lugar centralizado donde se guarda lo que aprendes sobre clientes y mercado (no solo en la cabeza de una persona)?',
      '¿Mides si tus campañas o lanzamientos funcionaron, comparando contra lo esperado?',
      '¿Alguien en tu equipo tiene la responsabilidad explícita de dar seguimiento al mercado?'
    ]
  },
  {
    clave: 'exposicion', nombre: 'Exposición al riesgo de mercado', tipo: 'exposicion',
    items: [
      '¿Dependes de un solo cliente o un grupo pequeño de clientes para la mayoría de tus ingresos?',
      '¿Tu oferta depende de un solo canal de venta o distribución?',
      '¿Ha bajado tu participación de mercado o tus ventas frente a la competencia en el último año?',
      '¿Te ha sorprendido un movimiento de la competencia o un cambio del mercado en el último año?'
    ]
  }
];

function _opcionesDe(tipo) { return tipo === 'exposicion' ? OPCIONES_EXPOSICION : OPCIONES_PRACTICA; }

// Dos preguntas cerradas sobre el negocio (David, oct-2026) — no se
// califican dentro del semáforo (no son parte de CATEGORIAS_RIESGO), pero
// dan contexto real al mapa de impacto y a la interpretación con IA (ver
// giroPM/tipoVentaPM en apiGenerarInterpretacionMuestra, WebApp.gs).
var OPCIONES_GIRO = [
  'Comercio (venta de productos)', 'Servicios profesionales', 'Manufactura o producción',
  'Tecnología o software', 'Alimentos y bebidas', 'Otro'
];
var OPCIONES_TIPO_VENTA = [
  'Venta directa en punto físico', 'Venta en línea (redes sociales o tienda en línea)',
  'Venta mixta (física y en línea)', 'Venta por mayoreo o distribuidores', 'Otro'
];

function _semaforo(puntaje) {
  if (puntaje <= 13) return { clave: 'verde', etiqueta: 'Vacío bajo', claseCss: 'verde' };
  if (puntaje <= 26) return { clave: 'amarillo', etiqueta: 'Vacío moderado', claseCss: 'amarillo' };
  return { clave: 'rojo', etiqueta: 'Vacío alto', claseCss: 'rojo' };
}

function _nivelBarra(sub, max) {
  var pct = sub / max;
  if (pct <= 0.33) return 'baja';
  if (pct <= 0.66) return 'media';
  return 'alta';
}

var CATEGORIAS_CRM_OPCIONES = ['Gobierno y Sector Público', 'ONG y Fundaciones', 'Educación', 'Salud y Bienestar',
  'Universidad', 'Cámara empresarial', 'Empresa privada', 'Retail y Consumo', 'Fintech y Servicios',
  'Tecnología y Telecom', 'Turismo y Hospitalidad', 'Organismo internacional', 'Otro'];

/* ============================================================
 * Mapa de impacto (segundo rediseño, oct-2026) — ya no es un solo punto con
 * un círculo por nivel: ahora cada lado (tu alcance HOY y el alcance al que
 * quieres LLEGAR) puede marcar VARIOS lugares reales, según el nivel que
 * elija para ese lado:
 *   - Local: uno o varios MUNICIPIOS (de los estados que elija).
 *   - Estatal: uno o varios ESTADOS de México.
 *   - Nacional: no se puntea nada — "nacional" ya significa todo México.
 *   - Internacional: uno o varios PAÍSES (o "Otro" con texto libre si no
 *     está en el catálogo — ese no se puede dibujar en el mapa porque no
 *     conocemos su coordenada, pero sí se guarda como dato).
 * "¿Desde dónde opera tu negocio?" quedó fusionada con "tu alcance HOY":
 * los lugares que se marcan ahí SON el alcance actual.
 *
 * No tenemos coordenadas reales por municipio (solo nombres, ver
 * ESTADOS_MUNICIPIOS) — cada municipio elegido se dibuja como un punto
 * aproximado cerca del centro de su estado (desplazado de forma
 * determinística según el nombre, para separar visualmente varios
 * municipios del mismo estado), nunca su ubicación exacta. El nombre real
 * siempre se guarda en los datos/PDF/correo.
 *
 * Deben mantenerse sincronizados con WebApp.gs los catálogos ESTADO_CENTROS
 * y ESTADO_RADIO_KM (el servidor ya no necesita duplicar ESTADOS_MUNICIPIOS
 * ni PAIS_CENTROS: el cliente resuelve cada lugar a {lat,lng,radioKm} antes
 * de mandarlo, el servidor solo dibuja los puntos que recibe).
 * ============================================================ */
var NIVELES_ALCANCE = ['Local', 'Estatal', 'Nacional', 'Internacional'];
var MAX_LUGARES_POR_LADO = 4;

var ESTADO_CENTROS = {
  'Aguascalientes': [21.8853, -102.2916], 'Baja California': [32.6245, -115.4523],
  'Baja California Sur': [24.1426, -110.3128], 'Campeche': [19.8301, -90.5349],
  'Chiapas': [16.7516, -93.1029], 'Chihuahua': [28.6353, -106.0889],
  'Ciudad de México': [19.4326, -99.1332], 'Coahuila': [25.4260, -101.0053],
  'Colima': [19.2433, -103.7247], 'Durango': [24.0277, -104.6532],
  'Estado de México': [19.2926, -99.6568], 'Guanajuato': [21.0190, -101.2574],
  'Guerrero': [17.5506, -99.5024], 'Hidalgo': [20.1011, -98.7591],

function _radioBaseKmLugar(nivel, estadoParaRadio) {
  if (nivel === 'Estatal') return ESTADO_RADIO_KM[estadoParaRadio] || RADIO_KM_ESTATAL_DEFECTO;
  if (nivel === 'Nacional') return RADIO_KM_NACIONAL;
  if (nivel === 'Internacional') return RADIO_KM_PAIS;
  return RADIO_KM_LOCAL;
}
function radioKmLugar(nivel, intensidad, estadoParaRadio) {
  var base = _radioBaseKmLugar(nivel, estadoParaRadio);
  var i = Number(intensidad);
  if (!isFinite(i) || i < 1) i = 1;
  if (i > 5) i = 5;
  return base * (i / 5);
}

// Offset determinístico (mismo texto -> mismo punto siempre) para separar
// visualmente varios municipios de un mismo estado — no tenemos coordenadas
// reales por municipio, solo del estado; esto es una aproximación honesta,
// no un intento de simular precisión que no existe.
function _hashTexto(s) {
  var h = 0;
  s = String(s || '');
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }

  var h = _hashTexto(municipio);
  var angulo = (h % 360) * Math.PI / 180;

  var latRad = centroEstado[0] * Math.PI / 180;
  var dLat = (radioKmOffset / 111.32) * Math.cos(angulo);
  var dLng = (radioKmOffset / (111.32 * Math.max(Math.cos(latRad), 0.2))) * Math.sin(angulo);
  return [centroEstado[0] + dLat, centroEstado[1] + dLng];
}

function _nuevaSeleccionVacia(nivel) {

function _resolverLugar(nivel, sel) {

  if (nivel === 'Estatal') {
    if (!sel.estado) return null;
    var centro = ESTADO_CENTROS[sel.estado];
    if (!centro) return null;
    return { lat: centro[0], lng: centro[1], etiqueta: sel.estado, estadoParaRadio: sel.estado };

  if (nivel === 'Internacional') {
    if (!sel.pais) return null;
    if (sel.pais === 'Otro') {
      var texto = String(sel.otro || '').trim();
      if (!texto) return null;
      return { lat: null, lng: null, etiqueta: texto, estadoParaRadio: null };
    }
    var centroPais = PAIS_CENTROS[sel.pais];
    if (!centroPais) return null;

  for (var i = 0; i < TOTAL_PASOS; i++) {
    var cls = i < state.paso ? 'hecho' : (i === state.paso ? 'actual' : '');
    html += '<div class="paso ' + cls + '"></div>';
  }
  return html + '</div>';
}

function render() {
  // Con el cuestionario de 20 preguntas + historia antes del mapa, la
  // persona siempre da clic en "Continuar" al fondo de una página larga —
  // sin esto, la siguiente pantalla (p. ej. el mapa) se dibuja fuera de la
  // vista, con el scroll todavía abajo.
  window.scrollTo(0, 0);
  if (state.paso === 0) return renderDatos();
  if (state.paso === 1) return renderPreguntas();
  if (state.paso === 2) return renderMapaImpacto();
  return renderResultado();
}

/* ---- PASO 0: datos de la empresa (antes de la prueba) ---- */
function renderDatos() {
  var d = state.datos || {};
  app.innerHTML =
    progresoHtml() +
    '<h1>Pulso rápido de tu mercado</h1>' +

    '<div id="secMsg"></div>' +
    '<form id="datosForm">' +
      '<label>Nombre completo <span class="req">*</span></label><input type="text" id="dNombre" value="' + escapeHtml(d.nombre || '') + '">' +
      '<label>Empresa <span class="req">*</span></label><input type="text" id="dOrganizacion" value="' + escapeHtml(d.organizacion || '') + '">' +
      '<label>Categoría / sector <span class="req">*</span></label>' +
      '<select id="dCategoria">' +
        '<option value="">Selecciona una opción</option>' +
        CATEGORIAS_CRM_OPCIONES.map(function (c) {

        }).join('') +

      '<label>Teléfono (opcional)</label><input type="text" id="dTelefono" value="' + escapeHtml(d.telefono || '') + '">' +
      '<label>Cargo (opcional)</label><input type="text" id="dCargo" value="' + escapeHtml(d.cargo || '') + '">' +
      '<input type="text" id="dTrampa" class="campo-trampa" tabindex="-1" autocomplete="off">' +
      '<div class="consentimiento">' +
        '<input type="checkbox" id="dConsentimiento"' + (d.consentimiento ? ' checked' : '') + '>' +
        '<label for="dConsentimiento">Autorizo a Sintropía Social a contactarme para compartirme mi resultado y contarme sobre sus servicios. Puedo pedir que borren mis datos cuando quiera escribiendo a comunicacion@sintropiasocial.com.</label>' +
      '</div>' +
    '</form>' +
    '<div class="fila-botones"><button class="primary" id="btnSiguiente">Continuar →</button></div>';

  document.getElementById('btnSiguiente').onclick = function () {
    var msgBox = document.getElementById('secMsg');

    if (!email || email.indexOf('@') === -1) { msgBox.innerHTML = '<div class="msg error">Escribe un correo electrónico válido.</div>'; return; }

    };

/* ---- PASO 2: mapa de impacto — ya no es un único punto con un círculo por
 * nivel: ahora cada lado (HOY / META) puede marcar VARIOS lugares a la vez,
 * y el tipo de lugar que se marca cambia según el nivel elegido — Local =
 * municipio(s) dentro de un estado, Estatal = estado(s) completos, Nacional
 * = México entero (no hay nada que puntear), Internacional = país(es). La
 * pregunta "¿Desde dónde opera tu negocio?" ya no se pregunta aparte — es
 * exactamente el alcance de HOY (ver _bloqueAlcance('actual', ...) abajo),
 * por indicación de David.
 *
 * Arquitectura (oct-2026): el CLIENTE resuelve cada selección a
 * coordenadas reales usando sus propios catálogos (ESTADO_CENTROS,
 * ESTADOS_MUNICIPIOS, PAIS_CENTROS — ver arriba) antes de mandar nada al
 * servidor; el servidor (WebApp.gs) solo recibe puntos ya resueltos
 * {lat,lng,radioKm,etiqueta} y los dibuja — igual que ya hace la muestra
 * Territorio con sus "actores". Los municipios no tienen coordenada real
 * conocida, así que se dibujan como un punto aproximado cerca del centro
 * de su estado (ver _offsetMunicipio) — el nombre real siempre se guarda
 * en los datos/PDF/correo, el mapa es solo una referencia visual honesta,
 * no una geolocalización exacta. La intensidad 1-5 no desaparece: se
 * combina con cada punto marcado (círculo más grande o más chico sobre
 * ese mismo punto), tal como pidió David. ---- */

// Texto del tipo de lugar que corresponde a cada nivel — se usa en la
// pregunta de cantidad, placeholders y mensajes de validación.
function _etiquetaTipoLugar(nivel) {
  if (nivel === 'Local') return 'municipio';
  if (nivel === 'Estatal') return 'estado';
  if (nivel === 'Internacional') return 'país';
  return 'lugar';
}

// Cuenta cuántas selecciones de un lado ya están completas (resuelven a
// algo válido, con o sin coordenada — p. ej. un país "Otro" cuenta aunque
// no se pueda dibujar). Nacional siempre cuenta como 1 (México completo).
function _cantidadLugaresCompletos(ladoKey) {
  var lado = state.impacto[ladoKey];
  if (lado.nivel === 'Nacional') return 1;
  return (lado.lugares || []).filter(function (sel) { return _resolverLugar(lado.nivel, sel) !== null; }).length;
}

// ¿Hay algo que mostrar en el mapa de impacto, en cualquiera de los dos
// lados? Reemplaza la vieja bandera imp.tocado (de un solo punto) — ahora
// depende de si ya se resolvió al menos un lugar CON coordenada real.
function _hayMapaImpacto() {
  return _lugaresResueltos('actual').length > 0 || _lugaresResueltos('deseado').length > 0;
}

// ¿Ya está "listo" un lado para mandarse al servidor (prefetch del PNG)? —
// nivel + intensidad elegidos, y al menos un lugar completo (o Nacional,
// que no necesita puntear nada). Se usa para decidir CUÁNDO disparar el
// prefetch — no basta con que YA haya algo que mostrar en un lado, porque
// _cargarMapaImpactoPng memoiza su resultado: si se dispara con un lado
// todavía incompleto (p. ej. antes de elegir el alcance deseado), el PNG
// que llegue se queda pegado a esa versión incompleta para siempre.
function _ladoListoParaMapa(ladoKey) {
  var lado = state.impacto[ladoKey];
  if (!lado.nivel || !lado.intensidad) return false;
  if (lado.nivel === 'Nacional') return true;
  return _cantidadLugaresCompletos(ladoKey) > 0;
}

// Arma el HTML de un lado completo (nivel + intensidad + cantidad de
// lugares + los selectores de cada lugar). ladoKey es 'actual' o 'deseado'.
function _bloqueAlcance(ladoKey, tituloBloque, textoIntensidad) {
  var lado = state.impacto[ladoKey];
  var claseColor = ladoKey === 'actual' ? 'actual' : 'deseado';
  return (
    '<h3>' + tituloBloque + '</h3>' +
    '<label>Nivel ' + (ladoKey === 'actual' ? 'actual' : 'deseado') + ' <span class="req">*</span></label>' +
    '<select id="iNivel-' + ladoKey + '">' +
      '<option value="">Selecciona</option>' +
      NIVELES_ALCANCE.map(function (n) { return '<option' + (lado.nivel === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
    '</select>' +
    '<label>' + textoIntensidad + ' <span class="req">*</span></label>' +
    '<div class="escala-intensidad" id="escala-' + ladoKey + '">' +
      [1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" data-n="' + n + '" class="' + (lado.intensidad === n ? 'marcada ' + claseColor : '') + '">' + n + '</button>';
      }).join('') +
    '</div>' +
    '<div id="cantidadYLugares-' + ladoKey + '">' + _htmlCantidadYLugares(ladoKey) + '</div>'
  );
}

// HTML de "¿cuántos lugares quieres marcar?" + los selectores de cada uno —
// vacío si el nivel todavía no se eligió, o si es Nacional (no hay nada que
// puntear: siempre es México completo).
function _htmlCantidadYLugares(ladoKey) {
  var lado = state.impacto[ladoKey];
  if (!lado.nivel || lado.nivel === 'Nacional') return '';
  var tipoLugar = _etiquetaTipoLugar(lado.nivel);
  var opciones = [];
  for (var n = 1; n <= MAX_LUGARES_POR_LADO; n++) opciones.push(n);
  return (
    '<label>¿Cuántos ' + tipoLugar + 's quieres marcar? (hasta ' + MAX_LUGARES_POR_LADO + ')</label>' +
    '<select id="cantidad-' + ladoKey + '">' +
      opciones.map(function (n) {
        return '<option value="' + n + '"' + ((lado.cantidadLugares || 1) === n ? ' selected' : '') + '>' + n + '</option>';
      }).join('') +
    '</select>' +
    '<div id="lugares-' + ladoKey + '">' + _htmlLugaresPickers(ladoKey) + '</div>'
  );
}

// HTML de cada fila de selección de lugar — cambia según el nivel: Local
// pide estado + municipio (el municipio depende del estado elegido en esa
// misma fila); Estatal solo pide estado; Internacional pide país, con un
// campo de texto libre si elige "Otro" (país fuera del catálogo).
function _htmlLugaresPickers(ladoKey) {
  var lado = state.impacto[ladoKey];
  var estadosOrdenados = Object.keys(ESTADO_CENTROS).sort();
  var paisesOrdenados = Object.keys(PAIS_CENTROS).sort();
  return (lado.lugares || []).map(function (sel, i) {
    if (lado.nivel === 'Local') {
      var municipios = (sel.estado && ESTADOS_MUNICIPIOS[sel.estado]) ? ESTADOS_MUNICIPIOS[sel.estado].slice().sort() : [];
      return '<div class="fila-lugar">' +
        '<select data-lado="' + ladoKey + '" data-i="' + i + '" data-campo="estado">' +
          '<option value="">Estado</option>' +
          estadosOrdenados.map(function (e) { return '<option' + (sel.estado === e ? ' selected' : '') + '>' + e + '</option>'; }).join('') +
        '</select>' +
        '<select data-lado="' + ladoKey + '" data-i="' + i + '" data-campo="municipio"' + (!sel.estado ? ' disabled' : '') + '>' +
          '<option value="">' + (sel.estado ? 'Municipio' : 'Elige primero el estado') + '</option>' +
          municipios.map(function (m) { return '<option' + (sel.municipio === m ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
        '</select>' +
      '</div>';
    }
    if (lado.nivel === 'Estatal') {
      return '<div class="fila-lugar">' +
        '<select data-lado="' + ladoKey + '" data-i="' + i + '" data-campo="estado">' +
          '<option value="">Estado</option>' +
          estadosOrdenados.map(function (e) { return '<option' + (sel.estado === e ? ' selected' : '') + '>' + e + '</option>'; }).join('') +
        '</select>' +
      '</div>';
    }
    if (lado.nivel === 'Internacional') {
      return '<div class="fila-lugar">' +
        '<select data-lado="' + ladoKey + '" data-i="' + i + '" data-campo="pais">' +
          '<option value="">País</option>' +
          paisesOrdenados.map(function (p) { return '<option' + (sel.pais === p ? ' selected' : '') + '>' + p + '</option>'; }).join('') +
          '<option value="Otro"' + (sel.pais === 'Otro' ? ' selected' : '') + '>Otro (no está en la lista)</option>' +
        '</select>' +
        (sel.pais === 'Otro' ? '<input type="text" data-lado="' + ladoKey + '" data-i="' + i + '" data-campo="otro" placeholder="¿Qué país?" value="' + escapeHtml(sel.otro || '') + '">' : '') +
      '</div>';
    }
    return '';
  }).join('');
}

// Ajusta el arreglo de lugares de un lado al nuevo total elegido (1 a
// MAX_LUGARES_POR_LADO), agregando selecciones vacías o recortando sobrantes.
function _ajustarCantidadLugares(ladoKey, n) {
  var lado = state.impacto[ladoKey];
  n = Math.max(1, Math.min(MAX_LUGARES_POR_LADO, Number(n) || 1));
  lado.cantidadLugares = n;
  while (lado.lugares.length < n) lado.lugares.push(_nuevaSeleccionVacia(lado.nivel));
  while (lado.lugares.length > n) lado.lugares.pop();
}

// Re-dibuja SOLO el mapa compartido (círculos+puntos de ambos lados) y la
// ficha de texto — nunca toca los formularios, así que se puede llamar
// después de cualquier cambio sin perder el foco de un campo de texto
// (p. ej. mientras se escribe el nombre de un país "Otro"). El encuadre usa
// fitBounds en vez de un zoom calculado a mano — mucho más robusto cuando
// los puntos pueden estar en cualquier parte del mundo, no solo cerca de un
// único estado.
function _redibujarMapaImpacto() {
  if (!mapaImpactoLeaflet) return;
  capasImpactoLeaflet.forEach(function (capa) { mapaImpactoLeaflet.removeLayer(capa); });
  capasImpactoLeaflet = [];

  var lugaresActual = _lugaresResueltos('actual');
  var lugaresDeseado = _lugaresResueltos('deseado');

  function dibujarLado(lugares, colorHex, opacidad) {
    lugares.forEach(function (l) {
      var punto = L.circleMarker([l.lat, l.lng], { radius: 6, color: colorHex, weight: 2, fillColor: colorHex, fillOpacity: 0.95 });
      punto.bindTooltip(escapeHtml(l.etiqueta));
      var circulo = L.circle([l.lat, l.lng], { radius: Math.max(l.radioKm, 1) * 1000, color: colorHex, weight: 2, fillColor: colorHex, fillOpacity: opacidad });
      punto.addTo(mapaImpactoLeaflet); circulo.addTo(mapaImpactoLeaflet);
      capasImpactoLeaflet.push(punto, circulo);
    });
  }
  dibujarLado(lugaresActual, '#631EEB', 0.18);
  dibujarLado(lugaresDeseado, '#FF7929', 0.18);

  var todosLosPuntos = lugaresActual.concat(lugaresDeseado).map(function (l) { return [l.lat, l.lng]; });
  if (todosLosPuntos.length === 1) {
    mapaImpactoLeaflet.setView(todosLosPuntos[0], 6);
  } else if (todosLosPuntos.length > 1) {
    mapaImpactoLeaflet.fitBounds(L.latLngBounds(todosLosPuntos), { padding: [34, 34], maxZoom: 12 });
  } else {
    mapaImpactoLeaflet.setView(CENTRO_MEXICO, 4);
  }

  var ficha = document.getElementById('mapaImpactoFicha');
  if (ficha) {
    var imp = state.impacto;
    var hayAlgoQueMostrar = lugaresActual.length || lugaresDeseado.length || _lugaresSinCoordenada('actual').length || _lugaresSinCoordenada('deseado').length;
    ficha.innerHTML = hayAlgoQueMostrar ?
      ('<b>Hoy</b> — ' + escapeHtml(imp.actual.nivel || '—') + (imp.actual.intensidad ? ' (intensidad ' + imp.actual.intensidad + '/5)' : '') + ': ' + escapeHtml(_lugaresTexto('actual')) +
      '<br><b>Meta</b> — ' + escapeHtml(imp.deseado.nivel || '—') + (imp.deseado.intensidad ? ' (intensidad ' + imp.deseado.intensidad + '/5)' : '') + ': ' + escapeHtml(_lugaresTexto('deseado'))) :
      'Elige tu alcance y marca al menos un lugar de cada lado para dibujar tu mapa.';
  }

  // Dispara la petición del mapa real al servidor en cuanto AMBOS lados ya
  // están completos (no solo cuando ya hay algo que mostrar) — ver
  // _ladoListoParaMapa y _cargarMapaImpactoPng, más abajo.
  if (_ladoListoParaMapa('actual') && _ladoListoParaMapa('deseado')) _cargarMapaImpactoPng();
}

// Vuelve a dibujar la sección "¿cuántos lugares...? + sus selectores" de un
// lado (cuando cambia el nivel o la cantidad) y la vuelve a conectar.
function _actualizarCantidadYLugares(ladoKey) {
  var cont = document.getElementById('cantidadYLugares-' + ladoKey);
  if (cont) cont.innerHTML = _htmlCantidadYLugares(ladoKey);
  _wireCantidadYLugares(ladoKey);
  _redibujarMapaImpacto();
}

function _wireCantidadYLugares(ladoKey) {
  var selCantidad = document.getElementById('cantidad-' + ladoKey);
  if (selCantidad) {
    selCantidad.onchange = function () {
      _ajustarCantidadLugares(ladoKey, this.value);
      var contLugares = document.getElementById('lugares-' + ladoKey);
      if (contLugares) contLugares.innerHTML = _htmlLugaresPickers(ladoKey);
      _wireLugaresPickers(ladoKey);
      _redibujarMapaImpacto();
    };
  }
  _wireLugaresPickers(ladoKey);
}

// Conecta los selectores/input de texto de cada fila de lugar. Un cambio
// "estructural" (estado en Local, que cambia el catálogo de municipios; o
// país, que puede mostrar/ocultar el campo "Otro") vuelve a dibujar las
// filas; el resto (municipio final, texto libre de "Otro") solo actualiza
// el estado y redibuja el mapa, sin tocar el formulario (para no perder el
// foco mientras se escribe).
function _wireLugaresPickers(ladoKey) {
  var cont = document.getElementById('lugares-' + ladoKey);
  if (!cont) return;
  Array.prototype.forEach.call(cont.querySelectorAll('select, input'), function (el) {
    var campo = el.getAttribute('data-campo');
    var i = Number(el.getAttribute('data-i'));
    var esEstructural = campo === 'pais' || (campo === 'estado' && state.impacto[ladoKey].nivel === 'Local');
    var handler = function () {
      var lado = state.impacto[ladoKey];
      if (!lado.lugares[i]) lado.lugares[i] = _nuevaSeleccionVacia(lado.nivel);
      lado.lugares[i][campo] = this.value;
      if (campo === 'estado' && lado.nivel === 'Local') lado.lugares[i].municipio = '';
      if (campo === 'pais' && this.value !== 'Otro') lado.lugares[i].otro = '';
      if (esEstructural) {
        cont.innerHTML = _htmlLugaresPickers(ladoKey);
        _wireLugaresPickers(ladoKey);
      }
      _redibujarMapaImpacto();
    };
    if (el.tagName === 'SELECT') el.onchange = handler; else el.oninput = handler;
  });
}

// Conecta el nivel y la escala de intensidad de un lado completo.
function _wireAlcance(ladoKey) {
  document.getElementById('iNivel-' + ladoKey).onchange = function () {
    var lado = state.impacto[ladoKey];
    lado.nivel = this.value;
    lado.cantidadLugares = 1;
    lado.lugares = (lado.nivel && lado.nivel !== 'Nacional') ? [_nuevaSeleccionVacia(lado.nivel)] : [];
    _actualizarCantidadYLugares(ladoKey);
  };
  Array.prototype.forEach.call(document.getElementById('escala-' + ladoKey).querySelectorAll('button'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.getElementById('escala-' + ladoKey).querySelectorAll('button'), function (x) { x.classList.remove('marcada', 'actual', 'deseado'); });
      b.classList.add('marcada', ladoKey);
      state.impacto[ladoKey].intensidad = Number(b.getAttribute('data-n'));
      _redibujarMapaImpacto();
    };
  });
  _wireCantidadYLugares(ladoKey);
}

function renderMapaImpacto() {
  app.innerHTML =
    progresoHtml() +
    '<h2>Tu mapa de impacto</h2>' +
    '<p class="subtle" style="margin-top:0">Marca dónde operas HOY y a dónde quieres LLEGAR — el nivel que elijas decide qué puedes puntear: Local = municipio(s), Estatal = estado(s), Nacional = México completo, Internacional = país(es).</p>' +
    '<div id="secMsg"></div>' +
    _bloqueAlcance('actual', '¿Desde dónde opera tu negocio hoy?', '¿Qué tan consolidada está tu presencia ahí? (1 = apenas comenzando, 5 = muy consolidada)') +
    _bloqueAlcance('deseado', '¿A qué alcance quieres LLEGAR?', '¿Qué tan grande quieres que sea esa presencia? (1 = explorando, 5 = dominarlo)') +
    '<div id="mapaImpacto"></div>' +
    '<div class="mapa-ficha" id="mapaImpactoFicha"></div>' +
    '<div class="leyenda-circulos">' +
      '<span><span class="leyenda-punto actual"></span>Tu alcance hoy</span>' +
      '<span><span class="leyenda-punto deseado"></span>El alcance que quieres lograr</span>' +
    '</div>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnSiguiente">Ver mi semáforo de mercado</button>' +
    '</div>';

  if (mapaImpactoLeaflet) { mapaImpactoLeaflet.remove(); mapaImpactoLeaflet = null; }
  mapaImpactoLeaflet = L.map('mapaImpacto').setView(CENTRO_MEXICO, 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(mapaImpactoLeaflet);
  capasImpactoLeaflet = [];

  _wireAlcance('actual');
  _wireAlcance('deseado');
  _redibujarMapaImpacto();

  document.getElementById('btnAtras').onclick = function () { state.paso = 1; render(); };
  document.getElementById('btnSiguiente').onclick = async function () {
    var msgBox = document.getElementById('secMsg');
    var imp = state.impacto;
    if (!imp.actual.nivel || !imp.actual.intensidad) { msgBox.innerHTML = '<div class="msg error">Selecciona tu alcance actual y qué tan consolidada está tu presencia ahí.</div>'; return; }
    if (!imp.deseado.nivel || !imp.deseado.intensidad) { msgBox.innerHTML = '<div class="msg error">Selecciona el alcance que quieres lograr y qué tan grande quieres esa presencia.</div>'; return; }
    if (imp.actual.nivel !== 'Nacional' && _cantidadLugaresCompletos('actual') === 0) { msgBox.innerHTML = '<div class="msg error">Marca al menos un ' + _etiquetaTipoLugar(imp.actual.nivel) + ' de tu alcance actual.</div>'; return; }
    if (imp.deseado.nivel !== 'Nacional' && _cantidadLugaresCompletos('deseado') === 0) { msgBox.innerHTML = '<div class="msg error">Marca al menos un ' + _etiquetaTipoLugar(imp.deseado.nivel) + ' del alcance que quieres lograr.</div>'; return; }

    // Por si todavía no se había disparado (ver _redibujarMapaImpacto arriba)
    // — _cargarMapaImpactoPng memoiza, así que llamarla de nuevo aquí no
    // duplica la solicitud si ya está en curso o ya respondió.
    _cargarMapaImpactoPng();

    var categorias = CATEGORIAS_RIESGO.map(function (cat, ci) {

  if (mapaImpactoRecapLeaflet) { mapaImpactoRecapLeaflet.remove(); mapaImpactoRecapLeaflet = null; }
  if (_hayMapaImpacto()) {
    mapaImpactoRecapLeaflet = L.map('mapaImpactoRecap', { zoomControl: false, dragging: false, scrollWheelZoom: false }).setView(CENTRO_MEXICO, 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(mapaImpactoRecapLeaflet);
    var lugaresActualRecap = _lugaresResueltos('actual');
    var lugaresDeseadoRecap = _lugaresResueltos('deseado');
    function dibujarLadoRecap(lugares, colorHex, opacidad) {
      lugares.forEach(function (l) {
        L.circleMarker([l.lat, l.lng], { radius: 6, color: colorHex, weight: 2, fillColor: colorHex, fillOpacity: 0.95 }).addTo(mapaImpactoRecapLeaflet);
        L.circle([l.lat, l.lng], { radius: Math.max(l.radioKm, 1) * 1000, color: colorHex, weight: 2, fillColor: colorHex, fillOpacity: opacidad }).addTo(mapaImpactoRecapLeaflet);
      });
    }
    dibujarLadoRecap(lugaresActualRecap, '#631EEB', 0.3);
    dibujarLadoRecap(lugaresDeseadoRecap, '#FF7929', 0.18);
    // fitBounds en vez de un zoom calculado a mano — ahora puede haber
    // varios puntos dispersos (incluso en distintos países), no un único
    // anclaje cerca de un estado.
    var todosLosPuntosRecap = lugaresActualRecap.concat(lugaresDeseadoRecap).map(function (l) { return [l.lat, l.lng]; });
    if (todosLosPuntosRecap.length === 1) mapaImpactoRecapLeaflet.setView(todosLosPuntosRecap[0], 6);
    else if (todosLosPuntosRecap.length > 1) mapaImpactoRecapLeaflet.fitBounds(L.latLngBounds(todosLosPuntosRecap), { padding: [24, 24], maxZoom: 11 });
  }

  document.getElementById('btnDescargarPdf').onclick = function () { descargarPulsoPdf(); };
  // El correo se encola de inmediato (no espera a _iniciarCadenaIACorreo) —
  // ver el porqué en el comentario de _enviarResultadoMuestraCorreo.
  _enviarResultadoMuestraCorreo();
  _iniciarCadenaIACorreo();
  _cargarMapaImpactoPng();
}

// Arma los parámetros para generarInterpretacionMuestra — se usan en DOS
// lugares: en _iniciarCadenaIACorreo (para el PDF descargable del lado del
// cliente, si la IA alcanza a responder antes de que la persona lo pida) y
// dentro de _enviarResultadoMuestraCorreo (para que el procesador en
// segundo plano genere su propia ampliación con IA del lado del servidor).
function _paramsInterpretacionIA() {
  var d = state.datos || {}, r = state.resultado, imp = state.impacto;
  return {
    muestra: 'PulsoMercado',
    nombre: d.nombre,
    email: d.email,
    categoria: d.categoria,
    resultados: JSON.stringify(r.categorias.map(function (c) {
      return { nombre: c.nombre, puntaje: c.subtotal, max: c.max };
    })),
    semaforo: r.semaforo.etiqueta,
    puntajeTotal: r.puntajeTotal,
    peorCategoria: r.peor.nombre,
    historiaLocal: state.historia,
    nivelActual: imp.actual.nivel,
    nivelDeseado: imp.deseado.nivel,
    giro: state.giro,
    tipoVenta: state.tipoVenta,
    lugaresActualTexto: _lugaresTexto('actual'),
    lugaresDeseadoTexto: _lugaresTexto('deseado'),
    sitioWebTrampa: d.sitioWebTrampa
  };
}

/* ---- Interpretación ampliada con IA — SOLO para el PDF descargable del
 * lado del cliente (ver descargarPulsoPdf, más abajo, que usa
 * state.interpretacionIA si ya llegó). Ya NO dispara el correo — ver
 * _enviarResultadoMuestraCorreo, que se manda de inmediato al ver el
 * resultado, sin esperar esta respuesta. ---- */
function _iniciarCadenaIACorreo() {
  jsonp('generarInterpretacionMuestra', _paramsInterpretacionIA(), TIMEOUT_CORREO_IA_MS).then(function (resp) {
    if (resp && resp.ok && resp.interpretacion) state.interpretacionIA = resp.interpretacion;
  });
}

/* ---- Imagen real del mapa de impacto para el PDF: se pide al servidor lo
 * antes posible — ya desde el botón "Ver mi semáforo de mercado" del paso
 * del mapa (ver renderMapaImpacto), y de nuevo aquí por si no se llamó
 * antes — para que esté lista cuando la persona dé clic en "Descargar PDF".
 * _promesaMapaImpactoPng memoiza la solicitud en curso: si descargarPulsoPdf
 * llega antes de que responda, puede esperar esta MISMA promesa en vez de
 * conformarse de inmediato con el esquema de respaldo (ver más abajo). Si
 * de plano falla o tarda demasiado, el PDF cae al esquema de dos círculos
 * dibujados directamente con jsPDF (ver descargarPulsoPdf). */
var _promesaMapaImpactoPng = null;
function _mapaImpactoPayload() {
  return JSON.stringify({
    actual: { nivel: state.impacto.actual.nivel, lugares: _lugaresResueltos('actual') },
    deseado: { nivel: state.impacto.deseado.nivel, lugares: _lugaresResueltos('deseado') }
  });
}
// Ahora manda el mapa por POST (jsonpPost), no por GET (jsonp) — con varios
// lugares por lado el payload puede fácilmente superar el límite práctico
// de una URL; ver _despacharAccionPlataforma en WebApp.gs, que ya enruta
// cualquier acción no listada (incluida obtenerMapaImpactoPng) tanto desde
// doGet como desde doPost sin cambios adicionales de ruteo.
function _cargarMapaImpactoPng() {
  if (!_hayMapaImpacto() || state.mapaPngBase64) return Promise.resolve();
  if (_promesaMapaImpactoPng) return _promesaMapaImpactoPng;
  var d = state.datos || {};
  _promesaMapaImpactoPng = jsonpPost('obtenerMapaImpactoPng', {
    mapaImpacto: _mapaImpactoPayload(),
    email: d.email,
    sitioWebTrampa: d.sitioWebTrampa
  }).then(function (resp) {
    if (resp && resp.ok && resp.imagenBase64) state.mapaPngBase64 = resp.imagenBase64;
  });
  return _promesaMapaImpactoPng;
}

/* ---- Correo automático con el resultado (PDF adjunto + oferta con IA) ----
 * Se dispara de inmediato al ver el resultado — antes esperaba a la IA de
 * _iniciarCadenaIACorreo, pero eso significaba que si la persona cerraba
 * la ventana antes de esa respuesta, el correo nunca se llegaba a encolar.
 * Se manda paramsInterpretacionIA (no un texto ya generado) para que el
 * procesador en segundo plano genere su propia interpretación con IA en
 * el servidor — el correo sale completo sin importar qué haga la persona
 * después de ver su resultado. */
function _enviarResultadoMuestraCorreo() {
  if (state.correoResultadoEnviado) return;
  state.correoResultadoEnviado = true;
  var d = state.datos || {}, r = state.resultado, imp = state.impacto;
  var secciones = [
    { titulo: 'Interpretación de tu resultado', parrafos: (state.interpretacionReglas || '').split('\n\n').filter(function (p) { return p.trim(); }) },
    { titulo: 'Tus 5 recomendaciones', parrafos: (state.recomendacionesPM || []).map(function (rec, idx) { return (idx + 1) + '. ' + rec; }) },
    { titulo: 'Tu reflexión histórica', parrafos: [state.historia || ''] }
  ].concat(r.categorias.map(function (c) {
    return { titulo: c.nombre, parrafos: [c.subtotal + ' de ' + c.max + ' puntos de vacío.'] };
  }));
  var resumenTexto = 'Pulso de Mercado: ' + r.semaforo.etiqueta + ' (' + r.puntajeTotal + '/40). ' +
    'Mayor oportunidad: ' + r.peor.nombre + ' (' + r.peor.subtotal + '/' + r.peor.max + '). ' +
    'Alcance hoy: ' + (imp.actual.nivel || '—') + ' en ' + _lugaresTexto('actual') + ' · Alcance deseado: ' + (imp.deseado.nivel || '—') + ' en ' + _lugaresTexto('deseado') + '.';
  var mapaImpactoCorreo = _hayMapaImpacto() ? _mapaImpactoPayload() : '';
  jsonpPost('enviarResultadoMuestra', {
    tipoMuestra: 'PulsoMercado',
    nombre: d.nombre,
    correo: d.email,
    organizacion: d.organizacion,
    tituloResultado: 'Pulso de Mercado de tu empresa',
    resumenTexto: resumenTexto,
    secciones: JSON.stringify(secciones),
    paramsInterpretacionIA: JSON.stringify(_paramsInterpretacionIA()),
    mapaImpacto: mapaImpactoCorreo,
    sitioWebTrampa: d.sitioWebTrampa
  }, TIMEOUT_CORREO_IA_MS).then(function (resp) {
    var aviso = document.getElementById('correoAviso');
    if (!aviso) return;
    if (resp && resp.ok) {
      aviso.innerHTML = '<p class="subtle">Te enviamos una interpretación más completa de este resultado a <b>' + escapeHtml(d.email) + '</b>.</p>';
    } else {
      aviso.innerHTML = '<div class="msg error">No pudimos enviarte el correo con tu resultado' +
        (resp && resp.error ? (': ' + escapeHtml(resp.error)) : ' — intenta de nuevo más tarde') +
        '. Mientras tanto puedes descargarlo en PDF aquí abajo.</div>';
    }
  });
}

/* ---- Dos círculos esquemáticos para el PDF cuando la imagen real del
 * mapa (ver _cargarMapaImpactoPng) todavía no llegó o falló — jsPDF ya
 * sabe dibujar círculos nativamente (doc.circle), así que aquí no hace
 * falta aproximar un polígono como en el mapa territorial. ---- */
function _dibujarMapaImpactoEsquematico(doc, x, y, ancho, alto, lugaresActual, lugaresDeseado) {
  doc.setFillColor(250, 248, 255);
  doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
  doc.roundedRect(x, y, ancho, alto, 8, 8, 'FD');

  // Una fila de círculos por lado (en vez de dos círculos concéntricos como
  // antes) — ahora puede haber varios lugares por lado, así que cada uno
  // recibe su propio círculo, escalado entre sí según su radioKm relativo,
  // con el nombre del lugar debajo.
  function dibujarFila(lugares, colorRgb, yFila, altoFila) {
    if (!lugares.length) return;
    var n = lugares.length;
    var anchoSlot = ancho / n;
    var radioMax = Math.max.apply(null, lugares.map(function (l) { return l.radioKm; }).concat([1]));
    lugares.forEach(function (l, i) {
      var cx = x + anchoSlot * i + anchoSlot / 2;
      var cy = yFila + altoFila * 0.5;
      var radioPt = Math.max((l.radioKm / radioMax) * (Math.min(anchoSlot, altoFila) * 0.32), 4);
      doc.setDrawColor(colorRgb[0], colorRgb[1], colorRgb[2]);
      doc.setFillColor(colorRgb[0], colorRgb[1], colorRgb[2]);
      doc.circle(cx, cy, radioPt, 'FD');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
      doc.setTextColor(80, 80, 90);
      var etiquetaCorta = (doc.splitTextToSize(l.etiqueta, anchoSlot - 4) || [''])[0];
      doc.text(etiquetaCorta, cx, yFila + altoFila - 4, { align: 'center' });
    });
  }
  var altoFila = (alto - 10) / 2;
  dibujarFila(lugaresActual, [99, 30, 235], y + 5, altoFila);
  dibujarFila(lugaresDeseado, [255, 121, 41], y + 5 + altoFila, altoFila);
}

/* ---- Descargable en PDF ---- */
async function descargarPulsoPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.');
    return;
  }
  // Si la persona marcó su estado pero la imagen real del servidor todavía
  // no llega (ver _cargarMapaImpactoPng — ahora se dispara desde que los 5
  // campos del mapa quedan completos, no solo al dar clic en "Siguiente"),
  // vale la pena esperar antes de resignarse al esquema de respaldo. Un
  // primer intento de 10s no fue suficiente en producción (cold start de
  // Apps Script, o red lenta) — si para entonces no llegó, se intenta UNA
  // vez más (reiniciando la memoización) con una ventana más corta antes de
  // caer al esquema. Esto reemplaza la espera única de 6s que David reportó
  // insuficiente.
  var btnPdf = document.getElementById('btnDescargarPdf');
  if (_hayMapaImpacto() && !state.mapaPngBase64) {
    if (btnPdf) { btnPdf.disabled = true; btnPdf.textContent = 'Preparando tu mapa...'; }
    await Promise.race([
      _cargarMapaImpactoPng(),
      new Promise(function (resolve) { setTimeout(resolve, 10000); })
    ]);
    if (!state.mapaPngBase64) {
      _promesaMapaImpactoPng = null;
      await Promise.race([
        _cargarMapaImpactoPng(),
        new Promise(function (resolve) { setTimeout(resolve, 8000); })
      ]);
    }
    if (btnPdf) { btnPdf.disabled = false; btnPdf.textContent = 'Descargar mi resultado en PDF'; }
  }
  var r = state.resultado, d = state.datos || {}, imp = state.impacto;
  var lugaresActualPdf = _lugaresResueltos('actual'), lugaresDeseadoPdf = _lugaresResueltos('deseado');
  var rec = RECOMENDACION_SEMAFORO[r.semaforo.clave];
  var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  var purple = [99, 30, 235];
  var coloresLuz = { verde: [30, 132, 73], amarillo: [154, 123, 10], rojo: [192, 57, 43] };
  var margenIzq = 40, anchoTexto = 532, y;

  doc.setFillColor(purple[0], purple[1], purple[2]);
  doc.rect(0, 0, 612, 70, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('Sintropía Social — Pulso de Mercado', margenIzq, 42);

  y = 100;
  doc.setTextColor(30, 30, 30);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(d.organizacion || 'Tu empresa', margenIzq, y);
  y += 22;

  var col = coloresLuz[r.semaforo.clave];
  doc.setFillColor(col[0], col[1], col[2]);
  doc.circle(margenIzq + 7, y - 5, 6, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.setTextColor(col[0], col[1], col[2]);
  doc.text(r.semaforo.etiqueta.toUpperCase() + '   ·   ' + r.puntajeTotal + ' de 40 puntos de vacío', margenIzq + 20, y);
  y += 24;

  r.categorias.forEach(function (c) {
    doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
    doc.line(margenIzq, y, margenIzq + anchoTexto, y);
    y += 16;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(30, 30, 30);
    doc.text(c.nombre + '  —  ' + c.subtotal + '/' + c.max, margenIzq, y);
    y += 18;
  });

  // Mapa de impacto — ANTES de la historia, en el mismo orden que ya se ve
  // en pantalla (ver renderResultado). Imagen real si ya llegó (ver
  // _cargarMapaImpactoPng, y el await de arriba que ahora le da tiempo de
  // responder); si de plano no llegó, dos círculos esquemáticos (mismo
  // patrón que el mapa territorial), marcados como tales para que no se
  // confundan con el mapa real.
  var usoEsquemaMapa = false;
  if (_hayMapaImpacto()) {
    var altoMapaPdf = 190;
    if (y + altoMapaPdf + 34 > 730) { doc.addPage(); y = 60; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(purple[0], purple[1], purple[2]);
    doc.text('Tu mapa de impacto', margenIzq, y);
    y += 12;
    if (state.mapaPngBase64) {
      doc.setFillColor(250, 248, 255);
      doc.setDrawColor(230, 226, 245); doc.setLineWidth(1);
      doc.roundedRect(margenIzq, y, anchoTexto, altoMapaPdf, 8, 8, 'FD');
      try {
        var imgW = 640, imgH = 420, margenInterno = 8;
        var escala = Math.min((anchoTexto - margenInterno * 2) / imgW, (altoMapaPdf - margenInterno * 2) / imgH);
        var wFinal = imgW * escala, hFinal = imgH * escala;
        doc.addImage(state.mapaPngBase64, 'PNG', margenIzq + (anchoTexto - wFinal) / 2, y + (altoMapaPdf - hFinal) / 2, wFinal, hFinal);
      } catch (eImg) { _dibujarMapaImpactoEsquematico(doc, margenIzq, y, anchoTexto, altoMapaPdf, lugaresActualPdf, lugaresDeseadoPdf); usoEsquemaMapa = true; }
    } else {
      _dibujarMapaImpactoEsquematico(doc, margenIzq, y, anchoTexto, altoMapaPdf, lugaresActualPdf, lugaresDeseadoPdf);
      usoEsquemaMapa = true;
    }
    y += altoMapaPdf + 10;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(107, 107, 120);
    doc.text('Morado = tu alcance hoy (' + (imp.actual.nivel || '—') + ') · Naranja = el alcance que quieres lograr (' + (imp.deseado.nivel || '—') + ')', margenIzq, y);
    y += 16;
    if (usoEsquemaMapa) {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
      doc.setTextColor(140, 140, 150);
      doc.text('Esquema simplificado (sin mapa real de fondo) — tu mapa con ubicación real te llega por correo.', margenIzq, y);
      y += 14;
    }
    y += 4;
  }

  // Tu reflexión histórica — la persona la ve reflejada en su propio PDF,
  // no solo en pantalla.
  if (state.historia) {
    if (y > 700) { doc.addPage(); y = 60; }
    doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
    y += 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(purple[0], purple[1], purple[2]);
    doc.text('Tu reflexión histórica', margenIzq, y);
    y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.setTextColor(60, 60, 60);
    var lineasHistoria = doc.splitTextToSize(state.historia, anchoTexto);
    if (y + lineasHistoria.length * 13 > 740) { doc.addPage(); y = 60; }
    doc.text(lineasHistoria, margenIzq, y);
    y += lineasHistoria.length * 13 + 10;
  }

  // "¿Qué te conviene hacer?" — interpretación instantánea basada en
  // reglas, SIEMPRE disponible de inmediato (ver interpretacionReglasPM), a
  // diferencia de la interpretación ampliada de IA de abajo, que puede
  // tardar. Antes faltaba por completo en el PDF descargable: si la
  // persona lo bajaba antes de que la IA respondiera, se quedaba sin esta
  // sección — el PDF se veía parcial.
  if (state.interpretacionReglas) {
    if (y > 650) { doc.addPage(); y = 60; }
    doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
    y += 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(purple[0], purple[1], purple[2]);
    doc.text('¿Qué te conviene hacer?', margenIzq, y);
    y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.setTextColor(60, 60, 60);
    state.interpretacionReglas.split('\n\n').filter(function (p) { return p.trim(); }).forEach(function (parrafo) {
      var lineas = doc.splitTextToSize(parrafo, anchoTexto);
      if (y + lineas.length * 13 > 740) { doc.addPage(); y = 60; }
      doc.text(lineas, margenIzq, y);
      y += lineas.length * 13 + 8;
    });
    if ((state.recomendacionesPM || []).length) {
      y += 4;
      if (y > 700) { doc.addPage(); y = 60; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
      doc.setTextColor(purple[0], purple[1], purple[2]);
      doc.text('Tus 5 recomendaciones', margenIzq, y);
      y += 15;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.setTextColor(60, 60, 60);
      state.recomendacionesPM.forEach(function (recTexto, idx) {
        var lineasRec = doc.splitTextToSize((idx + 1) + '. ' + recTexto, anchoTexto);
        if (y + lineasRec.length * 13 > 740) { doc.addPage(); y = 60; }
        doc.text(lineasRec, margenIzq, y);
        y += lineasRec.length * 13 + 6;
      });
    }
  }

  if (state.interpretacionIA) {
    if (y > 650) { doc.addPage(); y = 60; }
    y += 6;
    doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
    y += 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(purple[0], purple[1], purple[2]);
    doc.text('Interpretación ampliada de nuestro equipo', margenIzq, y);
    y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.setTextColor(60, 60, 60);
    var lineasIa = doc.splitTextToSize(state.interpretacionIA, anchoTexto);
    if (y + lineasIa.length * 13 > 740) { doc.addPage(); y = 60; }
    doc.text(lineasIa, margenIzq, y);
    y += lineasIa.length * 13 + 6;
  }

  // Mismo bloque de recomendación + contacto que ya se muestra en pantalla
  // y en el correo.
  if (y > 650) { doc.addPage(); y = 60; }
  y += 8;
  doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.setTextColor(purple[0], purple[1], purple[2]);
  var lineasTituloRec = doc.splitTextToSize(rec.titulo, anchoTexto);
  doc.text(lineasTituloRec, margenIzq, y);
  y += lineasTituloRec.length * 14 + 4;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.setTextColor(80, 80, 90);
  var lineasTextoRec = doc.splitTextToSize(rec.texto, anchoTexto);
  doc.text(lineasTextoRec, margenIzq, y);
  y += lineasTextoRec.length * 13 + 10;
  // Enlace de verdad (clickeable dentro del PDF) en vez de la URL como texto
  // plano — un PDF no vuelve clickeable una URL solo por escribirla.
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.setTextColor(99, 30, 235);
  var etiquetaCitaPM = 'Haz tu cita aquí';
  doc.textWithLink(etiquetaCitaPM, margenIzq, y, { url: 'https://calendly.com/sintropiassociales/30min' });
  var anchoCitaPM = doc.getTextWidth(etiquetaCitaPM);
  doc.setDrawColor(99, 30, 235); doc.setLineWidth(0.4);
  doc.line(margenIzq, y + 1.5, margenIzq + anchoCitaPM, y + 1.5);
  doc.setTextColor(107, 107, 120);
  doc.text(' o escríbenos a comunicacion@sintropiasocial.com.', margenIzq + anchoCitaPM, y);
  y += 30;

  // Pie de marca, igual en espíritu al pie de los correos (wordmark +
  // sitio + correo de contacto), para que el PDF se sienta parte del mismo
  // sistema visual que ya conoce por el correo.
  if (y > 730) { doc.addPage(); y = 60; }
  doc.setDrawColor(230, 226, 245); doc.line(margenIzq, y, margenIzq + anchoTexto, y);
  y += 22;
  var centroX = margenIzq + anchoTexto / 2;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.setTextColor(purple[0], purple[1], purple[2]);
  doc.text('Sintropía Social', centroX, y, { align: 'center' });
  y += 16;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.setTextColor(107, 107, 120);
  doc.text('sintropiassociales-del.github.io  ·  comunicacion@sintropiasocial.com', centroX, y, { align: 'center' });

  doc.save('pulso-mercado-sintropia.pdf');
}

render();
</script>
